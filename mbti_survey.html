<!DOCTYPE html>
<html lang="ko">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>학습 유형 검사 - 스터디크랙</title>

    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }

        .mbti-wrap {
            max-width: 680px;
            margin: 60px auto 80px;
            padding: 0 20px;
        }

        /* 헤더 섹션 */
        .mbti-intro {
            text-align: center;
            margin-bottom: 48px;
        }
        .mbti-intro h1 {
            font-size: 1.9rem;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .mbti-intro p {
            font-size: 1rem;
            color: #64748b;
            line-height: 1.7;
        }

        /* 진행 바 */
        .progress-wrap {
            margin-bottom: 36px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        /* 섹션 라벨 */
        .section-badge {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 99px;
            padding: 3px 12px;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }

        /* 질문 카드 */
        .question-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            padding: 36px 32px;
            animation: fadeSlide 0.35s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.82rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        .question-text {
            font-size: 1.18rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* 선택지 버튼 */
        .choice-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .choice-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }
        .choice-btn:hover {
            border-color: #93c5fd;
            background: #eff6ff;
        }
        .choice-btn.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .choice-label {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .choice-btn.selected .choice-label {
            background: #2563eb;
            color: #fff;
        }
        .choice-text {
            font-size: 1rem;
            color: #334155;
            font-weight: 500;
            line-height: 1.4;
        }

        /* 네비게이션 버튼 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            gap: 12px;
        }
        .btn-prev, .btn-next {
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-prev {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-prev:hover { background: #e2e8f0; }
        .btn-next {
            background: #2563eb;
            color: #fff;
            margin-left: auto;
        }
        .btn-next:hover { background: #1d4ed8; }
        .btn-next:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* 결과 카드 */
        .result-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            padding: 48px 32px;
            text-align: center;
            display: none;
        }
        .result-emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .result-title {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .result-type {
            font-size: 3rem;
            font-weight: 900;
            color: #2563eb;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
        }
        .result-divider {
            width: 48px;
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 99px;
            margin: 20px auto;
        }
        .result-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 28px 0;
        }
        .score-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
        }
        .score-item .dim-label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.04em;
        }
        .score-item .dim-result {
            font-size: 1.4rem;
            font-weight: 900;
            color: #1e293b;
        }
        .score-item .dim-detail {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .btn-retry {
            margin-top: 12px;
            padding: 14px 36px;
            background: #f1f5f9;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-retry:hover { background: #e2e8f0; }

        @media (max-width: 520px) {
            .question-card { padding: 24px 18px; }
            .mbti-intro h1 { font-size: 1.5rem; }
            .result-type { font-size: 2.2rem; }
            .result-scores { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" class="logo-link">
                <img src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack 로고" style="height: 40px; width: auto;">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="/mypage" class="nav-btn">마이페이지</a>
        </nav>
    </header>

    <div class="mbti-wrap">
        <div class="mbti-intro">
            <h1>나의 학습 유형 검사</h1>
            <p>총 36개의 질문에 답하면<br>나만의 학습 유형 코드를 알 수 있어요.</p>
        </div>

        <!-- 진행 바 -->
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-info">
                <span id="progressText">1 / 36</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 질문 카드 -->
        <div id="questionArea">
            <div class="section-badge" id="sectionBadge">섹션 1 · 학습 접근법</div>
            <div class="question-card">
                <div class="question-number" id="qNumber">Q1</div>
                <div class="question-text" id="qText"></div>
                <div class="choice-list" id="choiceList">
                    <button class="choice-btn" id="choiceA" onclick="selectChoice(1)">
                        <span class="choice-label">A</span>
                        <span class="choice-text" id="choiceAText"></span>
                    </button>
                    <button class="choice-btn" id="choiceB" onclick="selectChoice(2)">
                        <span class="choice-label">B</span>
                        <span class="choice-text" id="choiceBText"></span>
                    </button>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn-prev" id="btnPrev" onclick="prevQuestion()" style="display:none;">이전</button>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>다음</button>
            </div>
        </div>

        <!-- 결과 카드 -->
        <div class="result-card" id="resultCard">
            <div class="result-emoji">📊</div>
            <div class="result-title">나의 학습 유형 코드</div>
            <div class="result-type" id="resultType"></div>
            <div class="result-divider"></div>
            <div class="result-scores" id="resultScores"></div>
            <button class="btn-retry" onclick="resetSurvey()">다시 검사하기</button>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            // 그룹 1: C(1) / I(2) — 학습 접근법
            { q: "새로운 단원을 시작할 때",       a: "개념서를 처음부터 정독한다",           b: "문제를 풀며 필요한 개념을 찾아본다" },
            { q: "문제를 틀렸을 때",              a: "개념 정의부터 다시 확인한다",           b: "해설의 풀이 흐름을 본다" },
            { q: "암기할 내용이 많을 때",          a: "내용을 먼저 정리한다",                 b: "문제에 반복 노출시키며 익힌다" },
            { q: "시험 직전 공부 방식은",          a: "개념 노트를 다시 본다",                b: "실전 문제를 더 푼다" },
            { q: "개념 이해가 안 될 때",           a: "교과서 및 정리본을 다시 본다",          b: "문제 예시를 여러 개 본다" },
            { q: "처음 보는 문제 유형에 대해",     a: "관련 개념부터 떠올린다",               b: "일단 접근해본다" },
            { q: "공부가 잘 안될 때",              a: "개념이 흔들린다고 느낀다",              b: "문제 감각이 떨어졌다고 느낀다" },
            { q: "공부 계획을 세울 때",            a: "개념 범위 기준으로 나눈다",             b: "문제 세트 기준으로 나눈다" },
            { q: "오답 정리 방식은",               a: "개념 단위로 묶는다",                   b: "문제 유형별로 묶는다" },

            // 그룹 2: S(1) / M(2) — 변화 적응력
            { q: "공부 루틴은",                    a: "항상 비슷한 방식이 좋다",               b: "조금씩 바뀌는 게 좋다" },
            { q: "문제 유형이 바뀌면",              a: "당황하는 편이다",                      b: "오히려 흥미가 생긴다" },
            { q: "모의고사 난이도 변화에 대해",     a: "안정적인 시험이 좋다",                  b: "변별력 있는 시험이 좋다" },
            { q: "공부 자료 선택 기준은",           a: "검증된 자료",                          b: "새로운 자료도 시도" },
            { q: "실전에서",                       a: "익숙한 패턴이 편하다",                  b: "변형 문제에 강하다" },
            { q: "시험장에서 더 흔들리는 건",       a: "예상보다 어려울 때",                   b: "예상보다 쉬울 때" },
            { q: "공부 중 가장 싫은 건",            a: "갑작스러운 방식 변화",                  b: "계속 똑같은 반복" },
            { q: "새로운 풀이를 보면",              a: "기존 방식이 낫다고 느낀다",             b: "써보고 싶다" },
            { q: "계획이 틀어지면",                a: "다시 원래대로 맞춘다",                  b: "그에 맞게 바꾼다" },

            // 그룹 3: D(1) / E(2) — 사고 방식
            { q: "문제 접근 시",                   a: "조건과 수치를 먼저 본다",               b: "전체 흐름을 먼저 본다" },
            { q: "헷갈리는 문제는",                a: "근거를 하나씩 다진다",                  b: "느낌상 답을 좁힌다" },
            { q: "선지 판단 기준은",               a: "명확한 근거",                          b: "어색함과 자연스러움의 차이" },
            { q: "계산 및 자료가 많을수록",         a: "오히려 편하다",                        b: "부담된다" },
            { q: "시간 부족 시",                   a: "정확한 문제만 푼다",                    b: "감으로라도 넓게 건드린다" },
            { q: "실수 원인은",                    a: "계산 조건 누락",                       b: "흐름 놓침" },
            { q: "설명을 들을 때",                 a: "근거가 중요하다",                       b: "맥락이 중요하다" },
            { q: "풀이를 설명한다면",              a: "단계별로 설명",                         b: "한 번에 요약" },
            { q: "문제를 고를 때",                 a: "확실한 문제부터",                       b: "느낌 오는 문제부터" },

            // 그룹 4: R(1) / F(2) — 계획 스타일
            { q: "하루 공부 계획은",               a: "정해진 대로 간다",                      b: "상황에 따라 바꾼다" },
            { q: "컨디션이 안 좋을 때",             a: "계획은 지킨다",                        b: "조정한다" },
            { q: "공부 시간 분배는",               a: "고정 비율",                             b: "그날그날 다름" },
            { q: "예상보다 진도가 느리면",          a: "밀어붙인다",                            b: "조정한다" },
            { q: "계획표를 보면",                  a: "빈칸이 불안하다",                        b: "여유가 필요하다" },
            { q: "장기 계획은",                    a: "자세할수록 좋다",                        b: "큰 틀만 있으면 된다" },
            { q: "공부 중 끌리는 과목이 생기면",   a: "계획대로 다른 과목 한다",               b: "그 과목 더 한다" },
            { q: "시험 전날은",                    a: "정해진 루틴",                           b: "컨디션 우선" },
            { q: "공부가 안될 때",                 a: "루틴 문제라고 생각한다",                 b: "상황 문제라고 생각한다" },
        ];

        const SECTIONS = [
            { label: "섹션 1 · 학습 접근법",  pairs: ["C", "I"] },
            { label: "섹션 2 · 변화 적응력",  pairs: ["S", "M"] },
            { label: "섹션 3 · 사고 방식",    pairs: ["D", "E"] },
            { label: "섹션 4 · 계획 스타일",  pairs: ["R", "F"] },
        ];

        let current = 0;
        let answers = new Array(36).fill(0);

        function renderQuestion() {
            const q = QUESTIONS[current];
            const sectionIdx = Math.floor(current / 9);

            document.getElementById('sectionBadge').textContent = SECTIONS[sectionIdx].label;
            document.getElementById('qNumber').textContent = `Q${current + 1}`;
            document.getElementById('qText').textContent = q.q;
            document.getElementById('choiceAText').textContent = q.a;
            document.getElementById('choiceBText').textContent = q.b;

            // 선택 상태 복원
            const saved = answers[current];
            document.getElementById('choiceA').classList.toggle('selected', saved === 1);
            document.getElementById('choiceB').classList.toggle('selected', saved === 2);

            // 다음 버튼
            document.getElementById('btnNext').disabled = (saved === 0);
            document.getElementById('btnNext').textContent = (current === 35) ? '결과 보기' : '다음';

            // 이전 버튼
            document.getElementById('btnPrev').style.display = (current > 0) ? 'block' : 'none';

            // 진행 바
            const pct = Math.round((current / 36) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${current + 1} / 36`;
            document.getElementById('progressPct').textContent = pct + '%';
        }

        function selectChoice(val) {
            answers[current] = val;
            document.getElementById('choiceA').classList.toggle('selected', val === 1);
            document.getElementById('choiceB').classList.toggle('selected', val === 2);
            document.getElementById('btnNext').disabled = false;
        }

        function nextQuestion() {
            if (answers[current] === 0) return;
            if (current === 35) {
                showResult();
                return;
            }
            current++;
            renderQuestion();
        }

        function prevQuestion() {
            if (current > 0) {
                current--;
                renderQuestion();
            }
        }

        function showResult() {
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('progressWrap').style.display = 'none';

            const dims = [];
            for (let g = 0; g < 4; g++) {
                let count1 = 0, count2 = 0;
                for (let i = g * 9; i < g * 9 + 9; i++) {
                    if (answers[i] === 1) count1++;
                    else count2++;
                }
                const chosen = count1 >= count2
                    ? SECTIONS[g].pairs[0]
                    : SECTIONS[g].pairs[1];
                dims.push({ chosen, count1, count2 });
            }

            const typeCode = dims.map(d => d.chosen).join('');
            document.getElementById('resultType').textContent = typeCode;

            const dimNames = ["학습 접근법", "변화 적응력", "사고 방식", "계획 스타일"];
            let html = '';
            dims.forEach((d, i) => {
                const [p1, p2] = SECTIONS[i].pairs;
                html += `
                <div class="score-item">
                    <div class="dim-label">${dimNames[i]}</div>
                    <div class="dim-result">${d.chosen}</div>
                    <div class="dim-detail">${p1} ${d.count1} · ${p2} ${d.count2}</div>
                </div>`;
            });
            document.getElementById('resultScores').innerHTML = html;

            const rc = document.getElementById('resultCard');
            rc.style.display = 'block';
            rc.style.animation = 'fadeSlide 0.4s ease';
        }

        function resetSurvey() {
            current = 0;
            answers = new Array(36).fill(0);
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('questionArea').style.display = 'block';
            document.getElementById('progressWrap').style.display = 'block';
            renderQuestion();
        }

        // 초기 렌더링
        renderQuestion();
    </script>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
