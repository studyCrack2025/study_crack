    <link rel="stylesheet" href="/css/style.css?v=20260524a">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }
        .mbti-wrap { max-width: 680px; margin: 0 auto 80px; padding: 83px 20px 0; }
        .mbti-intro { text-align: center; margin-bottom: 48px; }
        .mbti-intro h1 { font-size: 1.9rem; font-weight: 900; color: #0f172a; margin-bottom: 12px; }
        .mbti-intro p { font-size: 1rem; color: #64748b; line-height: 1.7; }
        .progress-wrap { margin-bottom: 36px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; font-weight: 500; }
        .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: 99px; transition: width 0.4s ease; }
        .section-badge { display: inline-block; font-size: 0.78rem; font-weight: 700; color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 99px; padding: 3px 12px; margin-bottom: 20px; letter-spacing: 0.02em; }
        .question-card { background: #fff; border-radius: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); padding: 36px 32px; animation: fadeSlide 0.35s ease; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .question-number { font-size: 0.82rem; font-weight: 700; color: #94a3b8; margin-bottom: 10px; letter-spacing: 0.05em; }
        .question-text { font-size: 1.18rem; font-weight: 700; color: #1e293b; margin-bottom: 28px; line-height: 1.5; }
        .choice-list { display: flex; flex-direction: column; gap: 14px; }
        .choice-btn { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border: 2px solid #e2e8f0; border-radius: 14px; background: #f8fafc; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; }
        .choice-btn:hover { border-color: #93c5fd; background: #eff6ff; }
        .choice-btn.selected { border-color: #2563eb; background: #eff6ff; }
        .choice-label { width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #64748b; flex-shrink: 0; transition: all 0.2s; }
        .choice-btn.selected .choice-label { background: #2563eb; color: #fff; }
        .choice-text { font-size: 1rem; color: #334155; font-weight: 500; line-height: 1.4; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; }
        .btn-prev { padding: 12px 28px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; background: #f1f5f9; color: #64748b; }
        .btn-prev:hover { background: #e2e8f0; }
        .btn-next { padding: 12px 28px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; background: #2563eb; color: #fff; margin-left: auto; }
        .btn-next:hover { background: #1d4ed8; }
        .btn-next:disabled { background: #cbd5e1; cursor: not-allowed; }
        .result-card { background: #fff; border-radius: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); padding: 48px 32px; text-align: center; display: none; }
        .result-emoji { font-size: 3rem; margin-bottom: 16px; }
        .result-title { font-size: 1.1rem; color: #64748b; font-weight: 500; margin-bottom: 10px; }
        .result-type { font-size: 3rem; font-weight: 900; color: #2563eb; letter-spacing: 0.12em; margin-bottom: 8px; }
        .result-divider { width: 48px; height: 4px; background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: 99px; margin: 20px auto; }
        .result-dim-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .result-dim-tag { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 99px; padding: 5px 16px; font-size: 0.85rem; font-weight: 700; color: #2563eb; }
        .result-desc { margin: 20px 0; font-size: 1rem; color: #475569; line-height: 1.6; font-weight: 500; word-break: keep-all; }
        .btn-retry { margin-top: 12px; padding: 14px 36px; background: #f1f5f9; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.2s; }
        .btn-retry:hover { background: #e2e8f0; }
        .btn-download { margin-top: 12px; margin-left: 10px; padding: 14px 36px; background: #10b981; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s; }
        .btn-download:hover:not(:disabled) { background: #059669; }
        .btn-download:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
        @media (max-width: 520px) { .question-card { padding: 24px 18px; } .mbti-intro h1 { font-size: 1.5rem; } .result-type { font-size: 2.2rem; } .result-scores { grid-template-columns: 1fr 1fr; } .btn-download { margin-left: 0; margin-top: 10px; width: 100%; } .btn-retry { width: 100%; } }

<body>
    <header id="site-header" class="scrolled">
        <div class="logo-container">
            <a href="/" class="logo-link">
                <img src="/assets/figma/figma-asset-04.svg" alt="StudyCrack 로고">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
        <div class="mobile-header-right">
            <span class="mobile-nav-label">MBTI 검사</span>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel">
        <div class="mobile-nav-top">
            <a class="mnp-logo" href="/"><img src="/assets/figma/figma-asset-04.svg" alt="StudyCrack"><span>StudyCrack</span></a>
            <button class="mobile-nav-close" id="mobileNavClose" aria-label="메뉴 닫기">✕</button>
        </div>
        <nav class="mobile-nav-links">
            <a href="/">홈</a>
            <a href="/mypage">마이페이지</a>
            <a href="#" id="mobileLogoutBtn" class="mnl-btn mnl-btn-logout">로그아웃</a>
        </nav>
    </div>

    <div class="mbti-wrap">
        <div class="mbti-intro" id="mbtiIntro">
            <h1>나의 학습 유형 검사</h1>
            <p>총 36개의 질문에 답하면<br>나만의 학습 유형 코드를 알 수 있어요.</p>
        </div>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress-info">
                <span id="progressText">1 / 36</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <div id="questionArea">
            <div class="section-badge" id="sectionBadge">섹션 1 · 학습 접근법</div>
            <div class="question-card">
                <div class="question-number" id="qNumber">Q1</div>
                <div class="question-text" id="qText"></div>
                <div class="choice-list" id="choiceList">
                    <button class="choice-btn" id="choiceA" onclick="selectChoice(1)">
                        <span class="choice-label">A</span>
                        <span class="choice-text" id="choiceAText"></span>
                    </button>
                    <button class="choice-btn" id="choiceB" onclick="selectChoice(2)">
                        <span class="choice-label">B</span>
                        <span class="choice-text" id="choiceBText"></span>
                    </button>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn-prev" id="btnPrev" onclick="prevQuestion()" style="display:none;">이전</button>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>다음</button>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            </div>
    </div>

    <script>
        const QUESTIONS = [
            // 그룹 1: C(1) / I(2) — 학습 접근법
            { q: "새로운 단원을 시작할 때",       a: "개념서를 처음부터 정독한다",           b: "문제를 풀며 필요한 개념을 찾아본다" },
            { q: "문제를 틀렸을 때",              a: "개념 정의부터 다시 확인한다",           b: "해설의 풀이 흐름을 본다" },
            { q: "암기할 내용이 많을 때",          a: "내용을 먼저 정리한다",                 b: "문제에 반복 노출시키며 익힌다" },
            { q: "시험 직전 공부 방식은",          a: "개념 노트를 다시 본다",                b: "실전 문제를 더 푼다" },
            { q: "개념 이해가 안 될 때",           a: "교과서 및 정리본을 다시 본다",          b: "문제 예시를 여러 개 본다" },
            { q: "처음 보는 문제 유형에 대해",     a: "관련 개념부터 떠올린다",               b: "일단 접근해본다" },
            { q: "공부가 잘 안될 때",              a: "개념이 흔들린다고 느낀다",              b: "문제 감각이 떨어졌다고 느낀다" },
            { q: "공부 계획을 세울 때",            a: "개념 범위 기준으로 나눈다",             b: "문제 세트 기준으로 나눈다" },
            { q: "오답 정리 방식은",               a: "개념 단위로 묶는다",                   b: "문제 유형별로 묶는다" },

            // 그룹 2: S(1) / M(2) — 변화 적응력
            { q: "공부 루틴은",                    a: "항상 비슷한 방식이 좋다",               b: "조금씩 바뀌는 게 좋다" },
            { q: "문제 유형이 바뀌면",              a: "당황하는 편이다",                      b: "오히려 흥미가 생긴다" },
            { q: "모의고사 난이도 변화에 대해",     a: "안정적인 시험이 좋다",                  b: "변별력 있는 시험이 좋다" },
            { q: "공부 자료 선택 기준은",           a: "검증된 자료",                          b: "새로운 자료도 시도" },
            { q: "실전에서",                       a: "익숙한 패턴이 편하다",                  b: "변형 문제에 강하다" },
            { q: "시험장에서 더 흔들리는 건",       a: "예상보다 어려울 때",                   b: "예상보다 쉬울 때" },
            { q: "공부 중 가장 싫은 건",            a: "갑작스러운 방식 변화",                  b: "계속 똑같은 반복" },
            { q: "새로운 풀이를 보면",              a: "기존 방식이 낫다고 느낀다",             b: "써보고 싶다" },
            { q: "계획이 틀어지면",                a: "다시 원래대로 맞춘다",                  b: "그에 맞게 바꾼다" },

            // 그룹 3: D(1) / E(2) — 사고 방식
            { q: "문제 접근 시",                   a: "조건과 수치를 먼저 본다",               b: "전체 흐름을 먼저 본다" },
            { q: "헷갈리는 문제는",                a: "근거를 하나씩 다진다",                  b: "느낌상 답을 좁힌다" },
            { q: "선지 판단 기준은",               a: "명확한 근거",                          b: "어색함과 자연스러움의 차이" },
            { q: "계산 및 자료가 많을수록",         a: "오히려 편하다",                        b: "부담된다" },
            { q: "시간 부족 시",                   a: "정확한 문제만 푼다",                    b: "감으로라도 넓게 건드린다" },
            { q: "실수 원인은",                    a: "계산 조건 누락",                       b: "흐름 놓침" },
            { q: "설명을 들을 때",                 a: "근거가 중요하다",                       b: "맥락이 중요하다" },
            { q: "풀이를 설명한다면",              a: "단계별로 설명",                         b: "한 번에 요약" },
            { q: "문제를 고를 때",                 a: "확실한 문제부터",                       b: "느낌 오는 문제부터" },

            // 그룹 4: R(1) / F(2) — 계획 스타일
            { q: "하루 공부 계획은",               a: "정해진 대로 간다",                      b: "상황에 따라 바꾼다" },
            { q: "컨디션이 안 좋을 때",             a: "계획은 지킨다",                        b: "조정한다" },
            { q: "공부 시간 분배는",               a: "고정 비율",                             b: "그날그날 다름" },
            { q: "예상보다 진도가 느리면",          a: "밀어붙인다",                            b: "조정한다" },
            { q: "계획표를 보면",                  a: "빈칸이 불안하다",                        b: "여유가 필요하다" },
            { q: "장기 계획은",                    a: "자세할수록 좋다",                        b: "큰 틀만 있으면 된다" },
            { q: "공부 중 끌리는 과목이 생기면",   a: "계획대로 다른 과목 한다",               b: "그 과목 더 한다" },
            { q: "시험 전날은",                    a: "정해진 루틴",                           b: "컨디션 우선" },
            { q: "공부가 안될 때",                 a: "루틴 문제라고 생각한다",                 b: "상황 문제라고 생각한다" },
        ];

        const SECTIONS = [
            { label: "섹션 1 · 학습 접근법", pairs: ["C", "I"] },
            { label: "섹션 2 · 변화 적응력", pairs: ["S", "M"] },
            { label: "섹션 3 · 사고 방식", pairs: ["D", "E"] },
            { label: "섹션 4 · 계획 스타일", pairs: ["R", "F"] },
        ];

        let current = 0;
        let answers = new Array(QUESTIONS.length).fill(0);

        function renderQuestion() {
            const q = QUESTIONS[current];
            const sectionIdx = Math.floor(current / 9);

            document.getElementById('sectionBadge').textContent = SECTIONS[sectionIdx] ? SECTIONS[sectionIdx].label : SECTIONS[0].label;
            document.getElementById('qNumber').textContent = `Q${current + 1}`;
            document.getElementById('qText').textContent = q.q;
            document.getElementById('choiceAText').textContent = q.a;
            document.getElementById('choiceBText').textContent = q.b;

            const saved = answers[current];
            document.getElementById('choiceA').classList.toggle('selected', saved === 1);
            document.getElementById('choiceB').classList.toggle('selected', saved === 2);

            document.getElementById('btnNext').disabled = (saved === 0);
            document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? '결과 보기' : '다음';
            document.getElementById('btnPrev').style.display = (current > 0) ? 'block' : 'none';

            const pct = Math.round((current / QUESTIONS.length) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${current + 1} / ${QUESTIONS.length}`;
            document.getElementById('progressPct').textContent = pct + '%';
        }

        function selectChoice(val) {
            answers[current] = val;
            document.getElementById('choiceA').classList.toggle('selected', val === 1);
            document.getElementById('choiceB').classList.toggle('selected', val === 2);
            document.getElementById('btnNext').disabled = false;
        }

        function nextQuestion() {
            if (answers[current] === 0) return;
            if (current === QUESTIONS.length - 1) {
                showResult();
                return;
            }
            current++;
            renderQuestion();
        }

        function prevQuestion() {
            if (current > 0) {
                current--;
                renderQuestion();
            }
        }

        function showResult() {
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('progressWrap').style.display = 'none';
            document.getElementById('mbtiIntro').style.display = 'none'; // 헤더도 가리기

            const dims = [];
            for (let g = 0; g < 4; g++) {
                let count1 = 0, count2 = 0;
                for (let i = g * 9; i < (g * 9) + 9; i++) {
                    if (i < answers.length) {
                        if (answers[i] === 1) count1++;
                        else if (answers[i] === 2) count2++;
                    }
                }
                const chosen = count1 >= count2 ? SECTIONS[g].pairs[0] : SECTIONS[g].pairs[1];
                dims.push({ chosen, count1, count2 });
            }

            const typeCode = dims.map(d => d.chosen).join('');
            const rc = document.getElementById('resultCard');
            const urlParams = new URLSearchParams(window.location.search);
            const fromTutorial = (urlParams.get('from_tutorial') || '').toLowerCase();
            const fromMypage = (urlParams.get('from_mypage') || '').toLowerCase();
            const isFromTutorial = urlParams.has('from_tutorial') && ['','1','true','y','yes'].includes(fromTutorial);
            const isFromMypage = urlParams.has('from_mypage') && ['','1','true','y','yes'].includes(fromMypage);

            const loadingHtml = (emoji, msg) => `
                <div class="result-emoji">${emoji}</div>
                <div class="result-title" style="font-size:1.2rem;font-weight:700;color:#1e293b;">${msg}</div>
            `;
            const redirectAfterDelay = (url) => {
                rc.innerHTML = loadingHtml('🔍', '크랙이가 결과를 분석중입니다...');
                rc.style.display = 'block';
                rc.style.animation = 'fadeSlide 0.4s ease';
                setTimeout(() => {
                    rc.innerHTML = loadingHtml('✨', '분석이 완료되었습니다!<br>잠시 후 이동합니다...');
                    setTimeout(() => { window.location.href = url; }, 1800);
                }, 2000);
            };

            // [로직 1] 튜토리얼을 통해 유입된 경우
            if (isFromTutorial) {
                redirectAfterDelay(`/tutorial?mbti_completed=true&mbti_result=${encodeURIComponent(typeCode)}`);
                return;
            }

            // [로직 2] 마이페이지를 통해 유입된 경우
            if (isFromMypage) {
                redirectAfterDelay(`/mypage?mbti_completed=true&mbti_result=${encodeURIComponent(typeCode)}`);
                return;
            }

            // [로직 3] 외부에서 직접 접속한 경우 (결과 제공)
            const dimNames = ["학습 접근법", "변화 적응력", "사고 방식", "계획 스타일"];
            const dimTagsHtml = dims.map((d, i) =>
                `<span class="result-dim-tag">${dimNames[i]}: ${d.chosen}</span>`
            ).join('');

            const tempDesc = `[${typeCode}] 유형은 본인만의 뚜렷한 주관과 체계적인 계획을 통해 목표를 달성하는 데에 탁월한 잠재력을 가진 유형입니다. (추후 상세 분석이 업데이트 될 예정입니다.)`;

            rc.innerHTML = `
                <div class="result-emoji">📊</div>
                <div class="result-title">나의 학습 유형 코드</div>
                <div class="result-type" id="finalTypeCode">${typeCode}</div>
                <div class="result-divider"></div>
                <div class="result-dim-tags">${dimTagsHtml}</div>
                <div class="result-desc">${tempDesc}</div>
                <div style="margin-top: 20px;">
                    <button class="btn-retry" onclick="resetSurvey()">다시 검사하기</button>
                    <button class="btn-download" type="button" disabled aria-disabled="true">분석 보고서 PDF 준비 중</button>
                </div>
            `;

            rc.style.display = 'block';
            rc.style.animation = 'fadeSlide 0.4s ease';
        }

        function resetSurvey() {
            current = 0;
            answers = new Array(QUESTIONS.length).fill(0);
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('mbtiIntro').style.display = 'block';
            document.getElementById('questionArea').style.display = 'block';
            document.getElementById('progressWrap').style.display = 'block';
            renderQuestion();
        }

        renderQuestion();
    </script>
