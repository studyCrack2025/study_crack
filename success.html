<!DOCTYPE html>
<html lang="ko">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 완료 - 스터디크랙</title>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            padding: 50px 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .icon { font-size: 4rem; margin-bottom: 20px; display: block; }
        .success-title { font-size: 1.8rem; color: #0F172A; margin-bottom: 15px; word-break: keep-all;}
        .success-msg { color: #4b5563; line-height: 1.6; margin-bottom: 30px; word-break: keep-all;}
        
        /* [수정] 버튼 스타일: 기초조사서 작성 유도 */
        .btn-survey {
            display: inline-block;
            padding: 15px 35px;
            background-color: #2563EB;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3);
            margin-bottom: 15px;
        }
        .btn-survey:hover { background-color: #1d4ed8; transform: translateY(-2px); }

        .btn-home-link {
            display: block;
            color: #64748b;
            text-decoration: underline;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        /* Black 테마용 스타일 */
        .black-theme .icon { color: #171717; }
        .black-theme .btn-survey { background-color: #171717; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .black-theme .btn-survey:hover { background-color: #333; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" style="display: flex; align-items: center; gap: 10px;">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
    </header>

    <div class="success-container" id="successBox">
        <span class="icon" id="successIcon">✅</span>
        <h2 class="success-title" id="successTitle">결제가 성공적으로 완료되었습니다!</h2>
        <p class="success-msg" id="successMsg">
            스터디크랙의 컨설팅 멤버가 되신 것을 환영합니다.<br>
            정확한 상담을 위해 <strong>기초조사서</strong>를 먼저 작성해주세요.
        </p>
        
        <a href="/survey" class="btn-survey">기초조사서 작성하기 →</a>
        <a href="/" class="btn-home-link">나중에 작성하고 메인으로 가기</a>
    </div>

    <script>
        // 페이지 로드 시 URL 파라미터 확인
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tier = urlParams.get('tier');

            // BLACK 티어일 경우 메시지 변경
            if (tier === 'black') {
                const box = document.getElementById('successBox');
                const title = document.getElementById('successTitle');
                const msg = document.getElementById('successMsg');
                const icon = document.getElementById('successIcon');

                // 스타일 및 텍스트 변경
                box.classList.add('black-theme'); 
                icon.innerHTML = '👑'; 
                title.innerText = "BLACK 멤버십 신청이 완료되었습니다.";
                msg.innerHTML = `
                    스터디크랙 BLACK 멤버십을 이용해 주셔서 감사합니다.<br>
                    최고의 결과를 위해 <strong>상세 기초조사서</strong> 작성이 필요합니다.<br>
                    지금 바로 입력을 시작해주세요.
                `;
            }
        });
    </script>
    
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
