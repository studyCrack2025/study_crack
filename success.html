<!DOCTYPE html>
<html lang="ko">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="facebook-domain-verification" content="55eup0qlw7p4hdgj5hyv2fsmhksvoj" />
    <meta name="naver-site-verification" content="e70d8cbe6d67167b9f8f6267985c17c42b616684" />
    <title>결제 완료 - 스터디크랙</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 결제 완료 페이지 전용 심플 스타일 */
        body {
            background-color: #f8fafc; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .success-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        /* 카드 상단에 얇은 포인트 컬러 라인 */
        .card-top-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: #2563eb;
            transition: background 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #2563EB;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            display: inline-block;
        }

        /* 결제 성공 아이콘 */
        .receipt-icon {
            font-size: 4.5rem;
            color: #10b981;
            margin-bottom: 15px;
            animation: floatUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 동적 티어 뱃지 */
        .tier-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            color: white;
        }

        .success-title {
            color: #1e293b;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 15px;
            margin-top: 0;
            word-break: keep-all;
        }

        .success-desc {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            word-break: keep-all;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #2563EB;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0, 0.1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0, 0.15);
            opacity: 0.9;
        }

        .btn-home {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: underline;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .btn-home:hover { color: #64748b; }
    </style>
</head>
<body>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="success-card">
        <div id="topLine" class="card-top-line"></div>
        
        <div class="logo">StudyCrack</div>
        <br>
        
        <i class="fas fa-file-invoice-dollar receipt-icon"></i>
        <br>

        <div id="tierBadge" class="tier-badge" style="background:#2563eb;">BASIC PLAN</div>
        
        <h1 id="successTitle" class="success-title">결제가<br>완료되었습니다!</h1>
        
        <p id="successDesc" class="success-desc">
            기본적인 입시 분석 솔루션을<br>바로 확인해 보세요.
        </p>
        
        <a id="actionBtn" href="/analysis" class="btn-action" style="background:#2563eb;">나만의 솔루션 보러가기</a>
        
        <a href="/" class="btn-home">메인 화면으로 돌아가기</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. URL 파라미터에서 tier 값 추출 (기본값: basic)
            const urlParams = new URLSearchParams(window.location.search);
            const tier = (urlParams.get('tier') || 'basic').toLowerCase();

            // 2. DOM 요소 가져오기
            const badge = document.getElementById('tierBadge');
            const title = document.getElementById('successTitle'); // 타이틀 변경을 위해 추가
            const desc = document.getElementById('successDesc');
            const btn = document.getElementById('actionBtn');
            const topLine = document.getElementById('topLine');

            // 3. 티어별 데이터 세팅 (마이페이지 프리미엄 뱃지 색상에 맞춤)
            const tierConfig = {
                'basic': {
                    name: 'BASIC PLAN',
                    title: '결제가<br>완료되었습니다!',
                    color: '#3B82F6', // 파란색
                    desc: '베이직 플랜 결제가 완료되었습니다.<br>지금 바로 <strong>나만의 입시 솔루션</strong>을 확인해보세요.',
                    btnText: '나만의 솔루션 보러가기',
                    btnLink: '/analysis'
                },
                'standard': {
                    name: 'STANDARD PLAN',
                    title: '결제가<br>완료되었습니다!',
                    color: '#64748B', // 슬레이트(회색)
                    desc: '스탠다드 플랜 결제가 완료되었습니다.<br>기초조사서를 작성하고 <strong>무제한 합격 예측</strong>을 이용해보세요.',
                    btnText: '기초조사서 작성하기',
                    btnLink: '/survey'
                },
                'pro': {
                    name: 'PRO PLAN',
                    title: '결제가<br>완료되었습니다!',
                    color: '#F59E0B', // 앰버(금색)
                    desc: '프로 플랜 결제가 완료되었습니다.<br>배정된 <strong>전담 컨설턴트</strong>와 함께 완벽한 입시 전략을 세워보세요.',
                    btnText: '마이페이지로 이동하기',
                    btnLink: '/mypage'
                },
                'black': {
                    name: 'BLACK PLAN',
                    title: '결제가<br>완료되었습니다!',
                    color: '#171717', // 검은색
                    desc: '블랙 플랜 결제가 완료되었습니다.<br>최상위권 도약을 위한 <strong>프리미엄 밀착 관리</strong>가 시작됩니다.',
                    btnText: '마이페이지로 이동하기',
                    btnLink: '/mypage'
                },
                'test': {
                    name: 'TEST',
                    title: '테스트 결제<br>완료되었습니다!',
                    color: '#6b7280',
                    desc: '100원 테스트 결제가 정상적으로 처리되었습니다.<br>결제 연동이 정상 작동 중입니다.',
                    btnText: '메인으로 돌아가기',
                    btnLink: '/'
                },
                // ========= 새롭게 추가된 trial 플랜 =========
                'trial': {
                    name: 'TRIAL PLAN',
                    title: '체험단 신청이<br>완료되었습니다!', // '결제' 대신 어울리는 문구로 변경
                    color: '#8B5CF6', // 보라색 포인트 (원하는 색상으로 변경 가능)
                    desc: '스터디크랙 체험단으로 참여해 주셔서 감사합니다.<br>지금 바로 <strong>프리미엄 입시 솔루션</strong>을 체험해보세요.',
                    btnText: '서비스 체험하러 가기',
                    btnLink: '/analysis'
                }
            };

            // 매칭되는 티어가 없으면 basic으로 처리
            const config = tierConfig[tier] || tierConfig['basic'];

            // 4. 화면 업데이트
            badge.innerText = config.name;
            badge.style.background = config.color;
            topLine.style.background = config.color;
            
            // 체험단의 경우 "결제가 완료되었습니다" 문구를 바꾸는 것이 자연스러울 수 있어 title 업데이트 로직 추가
            if(config.title) {
                title.innerHTML = config.title;
            }
            
            desc.innerHTML = config.desc;
            
            btn.innerText = config.btnText;
            btn.href = config.btnLink;
            btn.style.background = config.color;
        });
    </script>
</body>
</html>
