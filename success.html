    <style>
        /* 결제 완료 페이지 전용 심플 스타일 */
        body {
            background-color: #f8fafc; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .success-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        /* 카드 상단에 얇은 포인트 컬러 라인 */
        .card-top-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: #2563eb;
            transition: background 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #2563EB;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            display: inline-block;
        }

        /* 결제 성공 아이콘 */
        .receipt-icon {
            font-size: 4.5rem;
            color: #10b981;
            margin-bottom: 15px;
            animation: floatUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 동적 티어 뱃지 */
        .tier-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            color: white;
        }

        .success-title {
            color: #1e293b;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 15px;
            margin-top: 0;
            word-break: keep-all;
        }

        .success-desc {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            word-break: keep-all;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #2563EB;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0, 0.1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0, 0.15);
            opacity: 0.9;
        }

        .btn-home {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: underline;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .btn-home:hover { color: #64748b; }
    </style>
</head>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"

    <div class="success-card">
        <div id="topLine" class="card-top-line"></div>

        <div class="logo">StudyCrack</div>
        <br>

        <i id="receiptIcon" class="fas fa-file-invoice-dollar receipt-icon"></i>
        <br>

        <div id="tierBadge" class="tier-badge" style="background:#2563eb;">결제 확인</div>

        <h1 id="successTitle" class="success-title">결제 내역을 확인하고 있습니다</h1>

        <p id="successDesc" class="success-desc">
            잠시만 기다려 주세요.
        </p>

        <div id="vbankBox" style="display:none; margin: 0 0 25px; padding: 18px 16px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #e2e8f0;">
                <span style="color:#64748b; font-size:0.88rem;">은행</span>
                <strong id="vbankBank" style="color:#1e293b; font-size:0.95rem;">-</strong>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #e2e8f0;">
                <span style="color:#64748b; font-size:0.88rem;">계좌번호</span>
                <strong id="vbankAccount" style="color:#1e293b; font-size:0.95rem; user-select:all;">-</strong>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #e2e8f0;">
                <span style="color:#64748b; font-size:0.88rem;">예금주</span>
                <strong id="vbankHolder" style="color:#1e293b; font-size:0.95rem;">-</strong>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #e2e8f0;">
                <span style="color:#64748b; font-size:0.88rem;">입금 금액</span>
                <strong id="vbankAmount" style="color:#2563eb; font-size:1.0rem;">-</strong>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0;">
                <span style="color:#64748b; font-size:0.88rem;">입금 기한</span>
                <strong id="vbankExpire" style="color:#ef4444; font-size:0.95rem;">-</strong>
            </div>
            <p style="margin:14px 0 0; padding-top:10px; border-top:1px solid #e2e8f0; color:#64748b; font-size:0.82rem; line-height:1.5;">
                입금이 확인되면 1~3분 내에<br>자동으로 결제가 처리됩니다.
            </p>
        </div>

        <a id="actionBtn" href="/analysis" class="btn-action" style="background:#2563eb;">나만의 솔루션 보러가기</a>

        <a href="/" class="btn-home">메인 화면으로 돌아가기</a>
    </div>
