<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A56B2" />
  <meta name="application-name" content="StudyCrack" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StudyCrack" />
  <title>StudyCrack</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="./assets/pwa/studycrack-apple-touch-icon-v1-180.png" />
  <link rel="manifest" href="./studycrack-mobile.webmanifest" />
  <link rel="stylesheet" href="./css/studycrack-mobile.css" />
  <link rel="stylesheet" href="./studycrack-mobile-app/dist/studycrack-mobile.css" />
</head>
<body>
  <div id="root"><div role="status">StudyCrack 앱을 불러오는 중입니다...</div></div>
  <script>
    window.__studycrackAppBooted = false;
    setTimeout(function () {
      if (window.__studycrackAppBooted) return;
      var root = document.getElementById('root');
      if (!root) return;
      var panel = document.createElement('div');
      panel.className = 'init-loading';
      var message = document.createElement('div');
      message.setAttribute('role', 'alert');
      var title = document.createElement('h3');
      title.textContent = '앱을 불러오지 못했습니다';
      var detail = document.createElement('p');
      var describe = function () {
        detail.textContent = navigator.onLine === false ? '오프라인 상태예요. 연결 후 다시 시도해주세요.' : '연결 상태를 확인한 뒤 페이지를 다시 불러와주세요.';
      };
      describe();
      window.addEventListener('online', describe);
      window.addEventListener('offline', describe);
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = '다시 불러오기';
      retry.onclick = function () { window.location.reload(); };
      message.append(title, detail);
      panel.append(message, retry);
      root.replaceChildren(panel);
    }, 12000);
  </script>
  <script src="./js/config.js"></script>
  <script src="./js/shared/api.js"></script>
  <script type="module" src="./studycrack-mobile-app/dist/studycrack-mobile.bundle.js"></script>
</body>
</html>
