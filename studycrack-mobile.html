<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyCrack Mobile App</title>
  <link rel="stylesheet" href="./css/studycrack-mobile.css" />
  <link rel="stylesheet" href="./studycrack-mobile-app/dist/studycrack-mobile.css" />
</head>
<body>
  <div id="root">StudyCrack 앱을 불러오는 중입니다...</div>
  <script>
    window.__studycrackAppBooted = false;
    setTimeout(function () {
      if (window.__studycrackAppBooted) return;
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML = '<div class="app-shell"><div class="app-frame"><div class="screen app-screen app-content"><div class="center init-loading"><h3>앱을 불러오지 못했습니다</h3><p class="sub">잠시 후 페이지를 새로고침해 주세요.</p></div></div></div></div>';
    }, 12000);
  </script>
  <script src="./js/config.js"></script>
  <script src="./js/shared/api.js"></script>
  <script type="module" src="./studycrack-mobile-app/dist/studycrack-mobile.bundle.js"></script>
</body>
</html>
