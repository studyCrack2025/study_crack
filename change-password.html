<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>비밀번호 변경 - 스터디크랙</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/change-password.css">
    
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
    <div class="pw-change-container">
        <div class="pw-change-header">
            <h2>비밀번호 변경</h2>
            <p>안전한 계정 사용을 위해 비밀번호를 변경해주세요.</p>
        </div>
        
        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" id="currentPassword" placeholder="현재 비밀번호를 입력해주세요">
        </div>
        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newChangePassword" placeholder="영문, 숫자, 특수문자 포함 8자 이상">
        </div>
        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="newChangePasswordConfirm" placeholder="새 비밀번호를 다시 입력해주세요">
        </div>
        
        <button class="btn-submit" onclick="executeChangePassword()">비밀번호 변경 완료</button>
        <button class="btn-cancel" onclick="history.back()">취소</button>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/change-password.js"></script>
</body>
</html>
