<head>

    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE BLACK - Private Lounge</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/black_theme.css">
    <link rel="stylesheet" href="css/black_consult.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
</head>
<body class="black-body">

    <header class="black-header-bar">
        <div class="logo-container">
            <a href="black_index.html" style="text-decoration:none;">
                <span class="logo gold-text">BLACK LOUNGE</span>
                <span class="sub-logo" style="color:#666; font-size:0.8rem; margin-left:10px; padding-left:10px; border-left:1px solid #333; letter-spacing:1px;">PRIVATE CONSULTING</span>
            </a>
        </div>
        <nav class="nav-links black-nav">
            <a href="black_consult.html" class="active-gold">1:1 Consulting</a>
            <a href="black_archive.html">Archive</a>
            <a href="black_univ_news.html">Univ News</a>
            <a href="black_community.html">Community</a>
            <a href="black_index.html" class="gold-btn" style="margin-left:20px;">
                나가기 <i class="fas fa-sign-out-alt"></i>
            </a>
        </nav>
    </header>
    
    <div class="consult-container">
        <div class="consult-layout">
            
            <aside class="info-sidebar">
                <div class="user-card">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="userName">User</h3>
                    <p class="user-tier">BLACK MEMBERSHIP</p>
                </div>
                
                <div class="sidebar-divider"></div>

                <div class="info-group">
                    <label>Current Status</label>
                    <div id="userStatus" class="info-val">-</div>
                </div>
                <div class="info-group">
                    <label>Target Stream</label>
                    <div id="userStream" class="info-val">-</div>
                </div>
                <div class="info-group">
                    <label>Target Universities</label>
                    <ul id="userTargets" class="target-list">
                        <li>-</li>
                    </ul>
                </div>
            </aside>

            <main class="chat-wrapper">
                <div class="chat-header-banner">
                    <div class="mentor-profile">
                        <div class="status-indicator">
                            <span class="status-dot online"></span>
                        </div>
                        <div class="mentor-info">
                            <span class="mentor-name" id="mentorNameDisplay">Consultant</span>
                            <span class="mentor-role">Dedicated Mentor</span>
                        </div>
                    </div>
                    <div class="chat-meta">
                        <i class="far fa-clock"></i> Avg. Response: 24h
                    </div>
                </div>

                <div class="chat-container" id="chatContainer">
                    <div class="chat-notice">
                        <i class="fas fa-shield-alt gold-icon"></i>
                        <p><strong>Secret Consulting Room</strong></p>
                        <p class="notice-desc">모든 대화 내용은 철저히 암호화되어 보호됩니다.</p>
                    </div>
                    <div id="chatList">
                        </div>
                </div>

                <div class="chat-input-area">
                    <div class="file-preview" id="filePreview" style="display:none;">
                        <div class="preview-box">
                            <i class="fas fa-file-alt"></i>
                            <span id="previewName">filename.ext</span>
                            <button onclick="clearFile()"><i class="fas fa-times"></i></button>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <label for="fileInput" class="attach-btn">
                            <i class="fas fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(this)">
                        
                        <textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요..." oninput="autoResize(this)"></textarea>
                        
                        <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/black_consult.js"></script>
    
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
