<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 MFA 초기 세팅 - 스터디크랙</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="/js/config.js"></script>
</head>
<body class="auth-body">
    <div class="auth-card" style="max-width: 500px;">
        <h2 style="margin-bottom: 20px;">관리자 MFA(인증 앱) 연결</h2>
        
        <div class="section-title">1. 관리자 계정 로그인</div>
        <div class="form-group">
            <input type="email" id="setupEmail" placeholder="관리자 이메일">
        </div>
        <div class="form-group">
            <input type="password" id="setupPassword" placeholder="비밀번호">
        </div>
        <button class="auth-btn" onclick="loginAndGetSecret()" style="background-color: #1e293b; margin-bottom: 20px;">시크릿 키 발급받기</button>

        <div id="step2" class="hidden">
            <div class="section-title">2. Google Authenticator 앱에 등록</div>
            <p style="font-size: 0.9rem; color: #475569; margin-bottom: 10px; text-align: left;">
                스마트폰에서 <strong>Google Authenticator</strong> 앱을 열고 <strong>[+] 버튼 ➔ [설정 키 입력]</strong>을 누른 뒤, 아래의 코드를 복사해서 '내 키' 란에 붙여넣으세요.
            </p>
            <div style="background: #f1f5f9; padding: 15px; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: #2563EB; border-radius: 8px; margin-bottom: 20px;" id="secretKeyDisplay">
                로딩중...
            </div>

            <div class="section-title">3. 최종 확인 (매핑)</div>
            <p style="font-size: 0.9rem; color: #475569; margin-bottom: 10px; text-align: left;">앱에 나타난 6자리 숫자를 입력하여 연동을 완료합니다.</p>
            <div class="form-group">
                <input type="text" id="totpCode" placeholder="6자리 인증 코드" maxlength="6" style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
            </div>
            <button class="auth-btn" onclick="verifyAndEnableMFA()">연동 완료 및 MFA 활성화</button>
        </div>
    </div>

    <script>
        const poolData = { UserPoolId: CONFIG.cognito.userPoolId, ClientId: CONFIG.cognito.clientId };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        let currentUser = null;

        function loginAndGetSecret() {
            const email = document.getElementById('setupEmail').value.trim();
            const password = document.getElementById('setupPassword').value;
            if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");

            const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: password });
            currentUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });

            currentUser.authenticateUser(authDetails, {
                onSuccess: function(result) {
                    // 로그인에 성공하면 MFA 시크릿 코드를 요청합니다.
                    currentUser.associateSoftwareToken({
                        associateSecretCode: function(secretCode) {
                            document.getElementById('secretKeyDisplay').innerText = secretCode;
                            document.getElementById('step2').classList.remove('hidden');
                        },
                        onFailure: function(err) { alert("시크릿 키 발급 실패: " + err.message); }
                    });
                },
                onFailure: function(err) { alert("로그인 실패: " + err.message); },
                mfaRequired: function() { alert("이미 MFA가 설정되어 작동 중인 계정입니다!"); }
            });
        }

        function verifyAndEnableMFA() {
            const code = document.getElementById('totpCode').value.trim();
            if(code.length !== 6) return alert("6자리 코드를 정확히 입력하세요.");

            // 1. 코드가 정확한지 검증
            currentUser.verifySoftwareToken(code, 'StudyCrackAdmin', {
                onSuccess: function() {
                    // 2. 검증에 성공하면 이 계정에 대해 인증 앱(TOTP)을 무조건 사용하도록 강제 설정
                    const totpSettings = { PreferredMfa: true, Enabled: true };
                    currentUser.setUserMfaPreference(null, totpSettings, function(err, result) {
                        if (err) {
                            alert("활성화 실패: " + err.message);
                        } else {
                            alert("🎉 완벽합니다! 관리자 계정에 MFA 매핑이 완료되었습니다.\n\n이제 이 페이지를 닫고 새로 만든 admin_login.html로 접속해 보세요.");
                            // 보안을 위해 로컬 데이터 삭제
                            currentUser.signOut();
                            window.location.href = '/admin_login.html'; 
                        }
                    });
                },
                onFailure: function(err) { alert("인증 코드가 틀렸습니다. 다시 시도해주세요."); }
            });
        }
    </script>
</body>
</html>
