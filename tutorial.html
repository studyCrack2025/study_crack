<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디크랙 튜토리얼</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/tutorial.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" class="logo-link">
                <img src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack 로고" style="height: 40px; width: auto;">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
    </header>

    <div class="tutorial-wrapper">
        <div class="mascot-section">
            <div class="dialogue-bubble" id="tutorialMsg">환영합니다! 스터디크랙의 튜토리얼을 시작할게요.</div>
            <img id="mascotImg" src="/assets/images/mascots/crack_hi.png" alt="크랙이" class="mascot-img">
        </div>

        <div class="step-container" id="stepContent">
            </div>

        <div class="tutorial-nav">
            <button id="tutPrevBtn" class="tut-btn btn-gray">이전</button>
            <button id="tutNextBtn" class="tut-btn btn-blue">다음</button>
        </div>
    </div>

    <template id="tpl-intro">
        <div class="step-card">
            <h2>🎉 스터디크랙에 오신 것을 환영해요!</h2>
            <p>나만의 맞춤형 입시 전략과 학습 코디를 받아볼 준비가 되셨나요?</p>
            <p>정확한 분석을 위해 몇 가지 기초 조사를 진행할게요.</p>
        </div>
    </template>

    <template id="tpl-survey-qual">
        <div class="step-card">
            <h3>1. 진로/희망 조사 (정성)</h3>
            <label class="input-label">현재 학년</label>
            <select id="tutStatus" class="tut-input">
                <option value="고1-2">고1/2 재학</option>
                <option value="고3">고3 재학</option>
                <option value="n수">N수생</option>
            </select>
            <label class="input-label">희망 계열</label>
            <select id="tutStream" class="tut-input">
                <option value="인문사회">인문사회</option>
                <option value="자연/공학">자연/공학</option>
                <option value="의치한약수">의치한약수</option>
            </select>
        </div>
    </template>

    <template id="tpl-survey-quan">
        <div class="step-card">
            <h3>2. 성적 입력 (정량 - 데모용)</h3>
            <p>표준점수와 백분위를 바탕으로 분석합니다.</p>
            <div class="score-inputs">
                <label>국어 (원점수): <input type="number" id="tutKor" class="tut-input"></label>
                <label>수학 (원점수): <input type="number" id="tutMath" class="tut-input"></label>
                <label>탐구1 (원점수): <input type="number" id="tutInq1" class="tut-input"></label>
                <label>탐구2 (원점수): <input type="number" id="tutInq2" class="tut-input"></label>
            </div>
        </div>
    </template>

    <template id="tpl-mbti">
        <div class="step-card">
            <h3>🧠 나의 학습 유형(MBTI) 알아보기</h3>
            <p>학습 성향을 분석하여 최적의 공부법을 추천해 드려요.</p>
            <button class="tut-action-btn" onclick="goToMBTI()">MBTI 검사하러 가기</button>
            <div style="margin-top:20px;">
                <p>이미 결과를 알고 있나요?</p>
                <input type="text" id="mbtiDirectInput" placeholder="예: INTP" class="tut-input" style="width: 150px; display:inline-block;">
                <button class="tut-btn btn-gray" onclick="skipMBTI()">결과 직접 입력</button>
            </div>
        </div>
    </template>

    <template id="tpl-univ-rec">
        <div class="step-card">
            <h3>🎯 추천 대학/학과 시뮬레이션</h3>
            <p>원점수 1점 상승 시 가장 효율이 좋은 학과들입니다. (클릭 시 시뮬레이션 전개)</p>
            <div class="univ-card-list" id="univCardList">
                </div>
        </div>
    </template>

    <template id="tpl-subject-rec">
        <div class="step-card">
            <h3>📚 맞춤형 과목/학습시간 추천</h3>
            <p>선택하신 학과와 MBTI에 맞춘 공부시간 배분입니다.</p>
            <div class="subject-card">
                <h4>효율 2순위 과목: <span id="sub2Name">수학</span></h4>
                <p>추천 투자 시간: <strong>전체 공부의 25%</strong></p>
                <p>120점 도달 필요 점수: +8점</p>
            </div>
            <div class="subject-card blurred" id="sub1Card">
                <h4>효율 1순위 과목: ?????</h4>
                <p>추천 투자 시간: 비밀</p>
            </div>
            <button class="tut-action-btn" onclick="upsellPayment()">최대효율과목 추천받고 플랜 시작하기</button>
        </div>
    </template>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/tutorial.js"></script>
</body>
</html>
