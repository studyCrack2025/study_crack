<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if('scrollRestoration'in history)history.scrollRestoration='manual';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디크랙 - 나만의 입시 전략 설정</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/tutorial.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="site-header" class="scrolled">
        <div class="logo-container">
            <a href="/" class="logo-link">
                <img src="/assets/figma/figma-asset-04.svg" alt="StudyCrack 로고">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
        <div class="mobile-header-right">
            <span class="mobile-nav-label">튜토리얼</span>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel">
        <div class="mobile-nav-top">
            <a class="mnp-logo" href="/"><img src="/assets/figma/figma-asset-04.svg" alt="StudyCrack"><span>StudyCrack</span></a>
            <button class="mobile-nav-close" id="mobileNavClose" aria-label="메뉴 닫기">✕</button>
        </div>
        <nav class="mobile-nav-links">
            <a href="/">홈</a>
            <a href="/mypage">마이페이지</a>
            <a href="#" id="mobileLogoutBtn" class="mnl-btn mnl-btn-logout">로그아웃</a>
        </nav>
    </div>

    <div class="tutorial-wrapper">
        <div class="mascot-section">
            <div class="dialogue-bubble" id="tutorialMsg">지금 바로 나만의 합격 전략을 확인해보세요.</div>
            <img id="mascotImg" src="/assets/images/mascots/crack_hi.png" alt="크랙이" class="mascot-img">
        </div>

        <div class="step-container" id="stepContent"></div>

        <div class="tutorial-nav">
            <button id="tutPrevBtn" class="tut-btn btn-gray">이전</button>
            <button id="tutNextBtn" class="tut-btn btn-blue">다음</button>
        </div>
    </div>

    <!-- Step 1: 인트로 -->
    <template id="tpl-intro">
        <div class="step-card">
            <div class="intro-badge">⚡ 무료 맞춤 입시 분석</div>
            <h2>3분이면 나만의 합격 전략이 완성돼요</h2>
            <p>성적과 학습 유형을 입력하면, 합격 가능 대학과 최우선 공부 과목을 바로 알려드릴게요.</p>
            <ul class="intro-checklist">
                <li><span class="check-icon">✓</span> 수능 환산 점수 자동 계산</li>
                <li><span class="check-icon">✓</span> 맞춤형 추천 대학 / 학과 시뮬레이션</li>
                <li><span class="check-icon">✓</span> 합격까지 과목별 공부시간 배분 전략</li>
            </ul>
        </div>
    </template>

    <!-- Step 2: 학년/계열 -->
    <template id="tpl-survey-qual">
        <div class="step-card">
            <h3>기본 정보 입력</h3>
            <p class="step-desc">정확한 분석을 위해 현재 상황을 알려주세요.</p>
            <label class="input-label">현재 학년 <span class="tut-req">*</span></label>
            <div class="tut-radio-group">
                <label><input type="radio" name="tutStudentStatus" value="고1-2" onchange="handleTutStatusChange(this.value)"> 고1/2 재학</label>
                <label><input type="radio" name="tutStudentStatus" value="고3" onchange="handleTutStatusChange(this.value)"> 고3 재학</label>
                <label><input type="radio" name="tutStudentStatus" value="n수" onchange="handleTutStatusChange(this.value)"> N수생</label>
                <label><input type="radio" name="tutStudentStatus" value="검정" onchange="handleTutStatusChange(this.value)"> 검정고시</label>
                <label><input type="radio" name="tutStudentStatus" value="other" onchange="handleTutStatusChange(this.value)"> 기타</label>
            </div>
            <input type="text" id="tutStatusEtc" class="tut-input" placeholder="직접 입력" style="display:none; margin-top:8px;">
            <label class="input-label">출신 학교 <span class="tut-req">*</span>
                <span class="tut-ged-wrap"><input type="checkbox" id="tutIsGed" onchange="handleTutGed(this.checked)"> 검정고시</span>
            </label>
            <input type="text" id="tutHighSchool" class="tut-input" placeholder="예: 서울고등학교">
            <label class="input-label">희망 계열 <span class="tut-req">*</span></label>
            <select id="tutStream" class="tut-input">
                <option value="">선택하세요</option>
                <option value="인문사회">인문사회</option>
                <option value="상경계열">상경계열</option>
                <option value="자연/공학">자연/공학</option>
                <option value="의치한약수">의치한약수</option>
                <option value="간호/보건">간호/보건</option>
                <option value="사범/교대">사범/교대</option>
                <option value="예체능">예체능</option>
                <option value="기타">기타</option>
            </select>
            <label class="input-label">스터디크랙을 통해 얻고 싶은 점 <span class="tut-req">*</span></label>
            <textarea id="tutBenefits" class="tut-input tut-textarea" rows="3" placeholder="예: 구체적인 수시 지원 라인을 잡고 싶습니다."></textarea>
            <label class="input-label">입시 고민 / 질문 (선택)</label>
            <textarea id="tutQuestions" class="tut-input tut-textarea" rows="3" placeholder="현재 가장 큰 입시 고민이나 멘토에게 묻고 싶은 점을 적어주세요."></textarea>
        </div>
    </template>

    <!-- Step 3: 성적 입력 -->
    <template id="tpl-survey-quan">
        <div class="step-card">
            <h3>성적 입력</h3>
            <p class="step-desc">3월 또는 5월 학력평가 원점수를 입력해주세요. 수능 환산 점수로 자동 보정됩니다.</p>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                <label style="font-size:0.9rem; font-weight:600; color:#475569;">시험 선택:</label>
                <select id="tutExamMonth" onchange="onTutExamMonthChange()" style="padding:6px 12px; border:1px solid #e2e8f0; border-radius:6px; font-size:0.9rem; color:#334155; background:#fff; cursor:pointer;">
                    <option value="mar">3월 학평</option>
                    <option value="may">5월 학평</option>
                </select>
            </div>
            <div id="tutMayWarning" style="display:none; margin-bottom:14px; padding:12px 16px; background:#fffbeb; border:1px solid #fcd34d; border-radius:8px; font-size:0.85rem; color:#92400e; line-height:1.6;">
                ⚠️ <strong>주의:</strong> 5월 학력평가는 성적표 발급 이전의 <strong>예상 등급컷 기반 임시 데이터</strong>입니다. 확정 데이터가 아니므로 표준점수·백분위는 실제와 다를 수 있습니다.
            </div>
            <div class="score-grid">
                <div class="score-input-card">
                    <div class="score-subject-label">국어</div>
                    <select class="score-select" id="tutKorSub">
                        <option value="화작">화법과작문</option>
                        <option value="언매">언어와매체</option>
                    </select>
                    <div class="score-sub-inputs">
                        <div class="score-sub-item">
                            <span class="score-sub-label">공통</span>
                            <div class="score-sub-input-row">
                                <input type="number" id="tutKorCommon" class="score-big-input score-split-input" min="0" max="76" placeholder="0" oninput="updateCombinedBar('tutKorCommon','tutKorSel',76,24,'barKor','totalKor')">
                                <span class="score-sub-max">/ 76</span>
                            </div>
                        </div>
                        <span class="score-sub-plus">+</span>
                        <div class="score-sub-item">
                            <span class="score-sub-label">선택</span>
                            <div class="score-sub-input-row">
                                <input type="number" id="tutKorSel" class="score-big-input score-split-input" min="0" max="24" placeholder="0" oninput="updateCombinedBar('tutKorCommon','tutKorSel',76,24,'barKor','totalKor')">
                                <span class="score-sub-max">/ 24</span>
                            </div>
                        </div>
                    </div>
                    <div class="score-bar-bg"><div class="score-bar-fill" id="barKor"></div></div>
                    <div class="score-total-label" id="totalKor">총점 0 / 100점</div>
                </div>
                <div class="score-input-card">
                    <div class="score-subject-label">수학</div>
                    <select class="score-select" id="tutMathSub">
                        <option value="확통">확률과통계</option>
                        <option value="미적">미적분</option>
                        <option value="기하">기하</option>
                    </select>
                    <div class="score-sub-inputs">
                        <div class="score-sub-item">
                            <span class="score-sub-label">공통</span>
                            <div class="score-sub-input-row">
                                <input type="number" id="tutMathCommon" class="score-big-input score-split-input" min="0" max="74" placeholder="0" oninput="updateCombinedBar('tutMathCommon','tutMathSel',74,26,'barMath','totalMath')">
                                <span class="score-sub-max">/ 74</span>
                            </div>
                        </div>
                        <span class="score-sub-plus">+</span>
                        <div class="score-sub-item">
                            <span class="score-sub-label">선택</span>
                            <div class="score-sub-input-row">
                                <input type="number" id="tutMathSel" class="score-big-input score-split-input" min="0" max="26" placeholder="0" oninput="updateCombinedBar('tutMathCommon','tutMathSel',74,26,'barMath','totalMath')">
                                <span class="score-sub-max">/ 26</span>
                            </div>
                        </div>
                    </div>
                    <div class="score-bar-bg"><div class="score-bar-fill" id="barMath"></div></div>
                    <div class="score-total-label" id="totalMath">총점 0 / 100점</div>
                </div>
                <div class="score-input-card">
                    <div class="score-subject-label">탐구 1과목</div>
                    <select class="score-select" id="tutInq1Name">
                        <option value="">과목 선택</option>
                        <optgroup label="사회탐구">
                            <option value="생윤">생활과 윤리</option>
                            <option value="윤사">윤리와 사상</option>
                            <option value="한지">한국지리</option>
                            <option value="세지">세계지리</option>
                            <option value="동사">동아시아사</option>
                            <option value="세사">세계사</option>
                            <option value="경제">경제</option>
                            <option value="정법">정치와 법</option>
                            <option value="사문">사회·문화</option>
                        </optgroup>
                        <optgroup label="과학탐구">
                            <option value="물1">물리학Ⅰ</option>
                            <option value="화1">화학Ⅰ</option>
                            <option value="생1">생명과학Ⅰ</option>
                            <option value="지1">지구과학Ⅰ</option>
                        </optgroup>
                    </select>
                    <div class="score-big-input-wrap">
                        <input type="number" id="tutInq1" class="score-big-input" min="0" max="50" placeholder="—" oninput="updateScoreBar(this, 50, 'barInq1')">
                        <span class="score-max">/ 50점</span>
                    </div>
                    <div class="score-bar-bg"><div class="score-bar-fill" id="barInq1"></div></div>
                </div>
                <div class="score-input-card">
                    <div class="score-subject-label">탐구 2과목</div>
                    <select class="score-select" id="tutInq2Name">
                        <option value="">과목 선택</option>
                        <optgroup label="사회탐구">
                            <option value="생윤">생활과 윤리</option>
                            <option value="윤사">윤리와 사상</option>
                            <option value="한지">한국지리</option>
                            <option value="세지">세계지리</option>
                            <option value="동사">동아시아사</option>
                            <option value="세사">세계사</option>
                            <option value="경제">경제</option>
                            <option value="정법">정치와 법</option>
                            <option value="사문">사회·문화</option>
                        </optgroup>
                        <optgroup label="과학탐구">
                            <option value="물1">물리학Ⅰ</option>
                            <option value="화1">화학Ⅰ</option>
                            <option value="생1">생명과학Ⅰ</option>
                            <option value="지1">지구과학Ⅰ</option>
                        </optgroup>
                    </select>
                    <div class="score-big-input-wrap">
                        <input type="number" id="tutInq2" class="score-big-input" min="0" max="50" placeholder="—" oninput="updateScoreBar(this, 50, 'barInq2')">
                        <span class="score-max">/ 50점</span>
                    </div>
                    <div class="score-bar-bg"><div class="score-bar-fill" id="barInq2"></div></div>
                </div>
            </div>
            <div class="score-grade-row">
                <div class="score-grade-item">
                    <div class="score-subject-label">영어</div>
                    <select id="tutEngGrd" class="score-select score-grade-select">
                        <option value="">등급 선택</option>
                        <option value="1">1등급</option>
                        <option value="2">2등급</option>
                        <option value="3">3등급</option>
                        <option value="4">4등급</option>
                        <option value="5">5등급</option>
                        <option value="6">6등급</option>
                        <option value="7">7등급</option>
                        <option value="8">8등급</option>
                        <option value="9">9등급</option>
                    </select>
                </div>
                <div class="score-grade-item">
                    <div class="score-subject-label">한국사</div>
                    <select id="tutHistGrd" class="score-select score-grade-select">
                        <option value="">등급 선택</option>
                        <option value="1">1등급</option>
                        <option value="2">2등급</option>
                        <option value="3">3등급</option>
                        <option value="4">4등급</option>
                        <option value="5">5등급</option>
                        <option value="6">6등급</option>
                        <option value="7">7등급</option>
                        <option value="8">8등급</option>
                        <option value="9">9등급</option>
                    </select>
                </div>
            </div>
        </div>
    </template>

    <!-- Step 4: MBTI -->
    <template id="tpl-mbti">
        <div class="step-card">
            <h3>학습 유형 파악</h3>
            <p class="step-desc">학습 성향을 분석하면 과목별 최적 공부법과 시간 배분을 추천해드려요.</p>
            <button class="tut-action-btn" onclick="goToMBTI()">📋 학습 유형 검사 시작하기 (3분)</button>
            <div class="mbti-divider"><span>또는 이미 결과를 알고 있다면</span></div>
            <p class="mbti-manual-title">유형 직접 선택</p>
            <div class="mbti-dim-list" id="mbtiDimList">
                <div class="mbti-dim-row">
                    <span class="mbti-dim-name">학습 접근법</span>
                    <div class="mbti-dim-btns">
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(0,'C',this)"><span class="dim-letter">C</span><span class="dim-sub">개념 중심</span></button>
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(0,'I',this)"><span class="dim-letter">I</span><span class="dim-sub">문제 중심</span></button>
                    </div>
                </div>
                <div class="mbti-dim-row">
                    <span class="mbti-dim-name">변화 적응력</span>
                    <div class="mbti-dim-btns">
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(1,'S',this)"><span class="dim-letter">S</span><span class="dim-sub">루틴 선호</span></button>
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(1,'M',this)"><span class="dim-letter">M</span><span class="dim-sub">변화 선호</span></button>
                    </div>
                </div>
                <div class="mbti-dim-row">
                    <span class="mbti-dim-name">사고 방식</span>
                    <div class="mbti-dim-btns">
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(2,'D',this)"><span class="dim-letter">D</span><span class="dim-sub">근거 중심</span></button>
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(2,'E',this)"><span class="dim-letter">E</span><span class="dim-sub">흐름 중심</span></button>
                    </div>
                </div>
                <div class="mbti-dim-row">
                    <span class="mbti-dim-name">계획 스타일</span>
                    <div class="mbti-dim-btns">
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(3,'R',this)"><span class="dim-letter">R</span><span class="dim-sub">계획 고수</span></button>
                        <button class="mbti-dim-btn" onclick="selectMBTIDim(3,'F',this)"><span class="dim-letter">F</span><span class="dim-sub">유연 조정</span></button>
                    </div>
                </div>
            </div>
            <div class="mbti-code-preview" id="mbtiCodePreview">
                <span class="mbti-preview-code" id="mbtiPreviewCode">?&nbsp;?&nbsp;?&nbsp;?</span>
                <button class="mbti-confirm-btn" id="mbtiConfirmBtn" onclick="confirmMBTIDims()" disabled>이 유형으로 분석 시작</button>
            </div>
        </div>
    </template>

    <!-- Step 5: 대학 시뮬레이션 -->
    <template id="tpl-univ-rec">
        <div class="step-card">
            <h3>추천 대학 시뮬레이션</h3>
            <p class="step-desc">취약 과목 1점 상승 시 가장 큰 효과를 볼 수 있는 대학이에요. 목표 대학을 선택하면 상세 분석을 확인할 수 있어요.</p>
            <div class="univ-card-list" id="univCardList"></div>
        </div>
    </template>

    <!-- Step 6: 과목별 최적 상승 계획 -->
    <template id="tpl-subject-rec">
        <div class="step-card">
            <h3>최소 노력으로 합격컷 도달하는 과목별 전략</h3>
            <p class="step-desc">MBTI 학습 성향과 현재 성적을 기반으로 최적 상승 계획을 계산했어요.</p>
            <div id="subjectRecContent"></div>
            <div class="upsell-btn-group">
                <button class="tut-upsell-btn btn-upsell-primary" onclick="upsellPayment()">🔓 Standard 결제하고 원하는 대학 진학 플랜 전체 보기</button>
                <button class="tut-upsell-btn btn-upsell-secondary" onclick="endTutorial()">튜토리얼 종료하기</button>
            </div>
        </div>
    </template>

    <div id="tutLoadingOverlay" class="tut-loading-overlay">
        <div class="tut-loading-spinner"></div>
        <div class="tut-loading-text">데이터를 분석 중입니다. 잠시만 기다려 주세요...</div>
    </div>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/shared/hamburger.js"></script>
    <script src="/js/tutorial.js"></script>
</body>
</html>
