    <div class="auth-card">

        <div class="auth-form">
            <div class="form-group">

            <div class="form-group">
                <input type="password" id="password" placeholder="비밀번호" required>

        </div>

        <div class="auth-links">
            <span>아직 계정이 없으신가요?</span>
            <a href="/signup" style="color: #2563EB; font-weight: bold;">회원가입하기</a>
