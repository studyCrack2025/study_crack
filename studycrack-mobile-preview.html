<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyCrack Mobile — Phase 7 런타임 셸 프리뷰</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="./css/studycrack-mobile.css" />
</head>
<body>
  <div id="root">Phase 7 런타임 셸 프리뷰 로딩 중...</div>
  <!-- API 설정(window.CONFIG). 번들이 백엔드 엔드포인트를 읽는다. 실제 런타임 studycrack-mobile.html도 동일 로드. -->
  <script src="./js/config.js"></script>
  <!-- 쿠키기반 인증 단일 출처(window.apiFetch/hasClientSession/redirectToLogin). 번들이 그대로 재사용. -->
  <script src="./js/shared/api.js"></script>
  <!-- Phase 7 빌드 산출물(React 포함 자기완결 IIFE). 실제 런타임(studycrack-mobile.html)과 분리된 프리뷰 전용. -->
  <!-- 빌드: cd studycrack-mobile-app && npm run build -->
  <script src="./studycrack-mobile-app/dist/studycrack-mobile.bundle.js"></script>
</body>
</html>
