<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>결제 내역 - 스터디크랙</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/payment-history.css">
  <script defer src="/js/config.js"></script>
  <script defer src="/js/shared/api.js"></script>
  <script defer src="/js/payment-history.js"></script>
</head>
<body>
  <main class="pay-history-page">
    <nav class="pay-history-actions" aria-label="계정으로 돌아가기"><a class="pay-history-link" href="/mypage">웹 마이페이지</a><a class="pay-history-link" href="/studycrack-mobile?screen=accountInfo">앱 계정 정보</a></nav>
    <h1>결제 내역</h1>
    <p>서버에 저장된 결제 기록입니다. 목록은 주문번호 순이며, 최신 결제순이 아닙니다. 현재 입금·이용권 반영 상태는 각 주문의 ‘상태 확인’에서 확인해 주세요.</p>
    <p>진행 중인 결제나 기록 저장이 지연된 주문은 보이지 않을 수 있습니다. 이미 결제·입금했다면 다시 결제하지 말고 결제 결과 화면에서 재확인하거나 문의해 주세요.</p>
    <p id="historyMessage" role="status">결제 내역을 확인하고 있어요.</p>
    <noscript>결제 내역 조회에는 JavaScript가 필요합니다. 확인이 어려우면 고객센터에 문의해 주세요.</noscript>
    <ol id="historyList" class="pay-history-list" aria-label="결제 기록"></ol>
    <div class="pay-history-actions">
      <button id="historyRefresh" type="button" class="pay-history-link">처음부터 다시 조회</button>
      <button id="historyMore" type="button" class="pay-history-link" hidden>다음 내역</button>
      <a id="historyLogin" class="pay-history-link" href="/login" target="_blank" rel="noopener noreferrer" hidden>새 탭에서 로그인</a>
      <a class="pay-history-link" href="/qna">문의하기</a>
    </div>
  </main>
</body>
</html>
