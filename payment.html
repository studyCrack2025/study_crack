<!DOCTYPE html>
<html lang="ko">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디크랙 - 컨설팅 신청</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/payment.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" class="logo-link">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
    </header>

    <div class="payment-container">
        <h2 style="text-align: center; margin-bottom: 30px;">목표 달성을 위한 플랜 선택</h2>
        
        <form id="paymentForm">
            <div class="form-group">
                <label for="name">이름 (학생 본인)</label>
                <input type="text" id="name" required placeholder="데이터 불러오는 중..." readonly style="background-color: #f3f4f6;">
            </div>
            <div class="form-group">
                <label for="phone">전화번호</label>
                <input type="tel" id="phone" required placeholder="데이터 불러오는 중..." readonly style="background-color: #f3f4f6;">
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" required placeholder="예: student@example.com">
            </div>

            <h3>신청할 프로그램 선택</h3>
            <div class="product-selection">
                
                <div class="product-option tier-basic" onclick="selectProduct(this, null, 'basic')">
                    <div class="product-header">
                        <span class="p-name">BASIC</span>
                        <span class="p-price">49,000원</span>
                    </div>
                    <small>AI 기반 목표대학 합격 진단 및 점수 상승 시뮬레이션</small>
                </div>

                <div class="product-option tier-standard" onclick="selectProduct(this, null, 'standard')">
                    <div class="product-header">
                        <span class="p-name">STANDARD</span>
                        <span class="p-price">월 149,000원</span>
                    </div>
                    <small>[Basic 혜택 포함] 매주 진행되는 플래너 점검 및 전문 컨설턴트 1:1 피드백</small>
                </div>

                <div class="product-option tier-pro" onclick="selectProduct(this, null, 'pro')">
                    <div class="product-header">
                        <span class="p-name">PRO</span>
                        <span class="p-price">월 299,000원</span>
                    </div>
                    <small>[Standard 혜택 포함] 상위 1%를 위한 프리미엄 심층 분석 리포트 발간</small>
                </div>

            </div>

            <button type="button" class="btn-pay" id="submitBtn" onclick="processPayment()">결제하기</button>
        </form>
    </div>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/payment.js"></script>
    
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
