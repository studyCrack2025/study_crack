<head>

    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="facebook-domain-verification" content="55eup0qlw7p4hdgj5hyv2fsmhksvoj" />
    <meta name="naver-site-verification" content="e70d8cbe6d67167b9f8f6267985c17c42b616684" />
    
    <meta name="description" content="스터디크랙 Standard·PRO 요금제 안내. 점수 상승 시뮬레이션" />
    <meta property="og:title" content="요금제 안내 | 스터디크랙" />
    <meta property="og:description" content="Basic 무료, Standard, PRO 요금제별 기능을 안내" />
    <meta property="og:image" content="https://studycrack.co.kr/og-image.jpg" />
    <meta property="og:url" content="https://studycrack.co.kr/payment" />
    <meta property="og:type" content="website" />
    <title>스터디크랙 - 멤버십 신청</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/payment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://studycrack.co.kr/payment" />
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" class="logo-link">
                <img src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack 로고">
                <span class="logo">StudyCrack</span>
            </a>
        </div>
    </header>

    <div class="payment-container">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="margin: 0 0 10px 0; color: #1e293b;">멤버십 플랜 선택</h2>
            <p style="margin: 0; color: #64748b; font-size: 0.95rem;">지금 선택에 따라 갈 수 있는 대학이 달라집니다</p>
        </div>
        
        <div id="activeSubBanner" class="active-sub-banner" style="display: none;">
            <div class="sub-icon"><i class="fas fa-crown"></i></div>
            <div class="sub-details">
                <span class="sub-label">현재 이용 중인 플랜</span>
                <strong id="activeSubName" class="sub-name">-</strong>
                <span id="activeSubDate" class="sub-date">-</span>
            </div>
        </div>
        <div id="pendingSubBanner" class="active-sub-banner" style="display: none; background: #eff6ff; border-color: #bfdbfe;">
            <div class="sub-icon" style="background: #dbeafe;"><i class="fas fa-calendar-check" style="color: #2563eb;"></i></div>
            <div class="sub-details">
                <span class="sub-label" style="color: #2563eb;">예약된 플랜</span>
                <strong id="pendingSubName" class="sub-name" style="color: #1d4ed8;">-</strong>
                <span id="pendingSubDate" class="sub-date">-</span>
            </div>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="name">이름 (학생 본인)</label>
                <input type="text" id="name" required placeholder="데이터 불러오는 중..." readonly style="background-color: #f3f4f6;">
            </div>
            <div class="form-group">
                <label for="phone">전화번호</label>
                <input type="tel" id="phone" required placeholder="데이터 불러오는 중..." readonly style="background-color: #f3f4f6;">
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" required placeholder="예: student@example.com">
            </div>

            <h3>나에게 맞는 합격 솔루션 선택</h3>
            <div class="product-selection pricing-table-container">
    <div class="pricing-col labels-col">
        <div class="p-header-space"></div>
        <div class="f-row">합격 시뮬레이션</div>
        <div class="f-row">주간 플래너</div>
        <div class="f-row">프리미엄 보고서</div>
    </div>

    <div id="testOption" class="product-option tier-trial" style="display: none;" onclick="selectProduct(this, null, 'test')">
        <div class="product-header">
            <span class="p-name">TEST</span>
            <span class="p-price">100원</span>
        </div>
        <div class="f-row">-</div>
        <div class="f-row">-</div>
        <div class="f-row">-</div>
    </div>

    <div id="trialOption" class="product-option tier-trial" style="display: none;" onclick="selectProduct(this, null, 'trial')">
        <div class="product-header">
            <span class="p-name">TRIAL</span>
            <span class="p-price">30,000원</span>
        </div>
        <div class="f-row">O<br><small>(무제한)</small></div>
        <div class="f-row">O</div>
        <div class="f-row">O</div>
    </div>

    <div class="product-option tier-basic" onclick="selectProduct(this, null, 'basic')">
        <div class="product-header">
            <span class="p-name">BASIC</span>
            <span class="p-price">
                <span class="original-price">49,000</span>
                <span class="discount-price">25,000원</span>
            </span>
        </div>
        <div class="f-row">O<br><small>(최대 30곳)</small></div>
        <div class="f-row text-muted">X</div>
        <div class="f-row text-muted">X</div>
    </div>

    <div class="product-option tier-standard" onclick="selectProduct(this, null, 'standard')">
        <div class="best-badge">BEST 추천</div>
        <div class="product-header">
            <span class="p-name">STANDARD</span>
            <span class="p-price">
                <span>149,000원</span>
                <small>/ 28일 이용권</small>
            </span>
        </div>
        <div class="f-row">O</div>
        <div class="f-row">O</div>
        <div class="f-row text-muted">X</div>
    </div>

    <div class="product-option tier-pro" onclick="selectProduct(this, null, 'pro')">
        <div class="product-header">
            <span class="p-name">PRO</span>
            <span class="p-price">
                <span>299,000원</span>
                <small>/ 28일 이용권</small>
            </span>
        </div>
        <div class="f-row">O</div>
        <div class="f-row">O</div>
        <div class="f-row">O</div>
    </div>
</div>

            <div id="tierMessageWrap" class="tier-message-wrap" style="display: none;">
                <div id="tierMessageText"></div>
            </div>

            <button type="button" class="btn-pay" id="submitBtn" onclick="processPayment()">👉 원하는 대학, 현실로 만들기</button>
        </form>
    </div>

    <script src="https://pay.nicepay.co.kr/v1/js/"></script>
    <script src="/js/config.js"></script>
    <script src="/js/payment.js"></script>
    
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
