      <button class="mobile-nav-close" id="mobileNavClose" aria-label="메뉴 닫기">✕</button>
    </div>
    <nav class="mobile-nav-links">
      <a href="/service">서비스 소개</a>
      <a href="/analysis" id="mobileNavAnalysis" class="hidden">나만의 솔루션</a>
      <a href="/qna" id="mobileNavQna" class="hidden">1:1 문의</a>
      <a href="/login" id="mobileLoginBtn" class="mnl-btn">로그인 / 회원가입</a>
      <a href="/mypage" id="mobileMyPageBtn" class="hidden">마이페이지</a>

  <main class="welcome-page">
    <section class="welcome-section">
      <div class="welcome-card" id="welcomeCard">
        <i class="fas fa-check-circle welcome-icon" id="welcomeIcon" aria-hidden="true"></i>
        <h1 class="welcome-title">회원가입이<br>완료되었습니다!</h1>
        <p class="welcome-desc">
          스터디크랙의 회원이 되신 것을 환영합니다.<br>
          지금 바로 <strong>나만의 맞춤 입시 전략</strong>을 확인해보세요.
        </p>
        <a href="/tutorial" class="btn btn--primary welcome-btn" id="mainActionBtn">튜토리얼 시작하기</a>
      </div>
    </section>
  </main>

  <script src="/js/shared/hamburger.js?v=20260524a"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userId = localStorage.getItem('userId');
      if (userId) {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ user_id: userId });
      }

      syncHeaderNav();
      bindHeaderActions();
      configureWelcomeContent();
    });

    function syncHeaderNav() {
      const isLoggedIn = !!localStorage.getItem('userId');

      const navAnalysis = document.getElementById('navAnalysis');
      const navQna = document.getElementById('navQna');
      const loginBtn = document.getElementById('loginBtn');
      const myPageBtn = document.getElementById('myPageBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      const mobileNavAnalysis = document.getElementById('mobileNavAnalysis');
      const mobileNavQna = document.getElementById('mobileNavQna');
      const mobileLoginBtn = document.getElementById('mobileLoginBtn');
      const mobileMyPageBtn = document.getElementById('mobileMyPageBtn');
      const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');

      if (isLoggedIn) {
        navAnalysis?.classList.remove('hidden');
        navQna?.classList.remove('hidden');
        myPageBtn?.classList.remove('hidden');
        logoutBtn?.classList.remove('hidden');
        loginBtn?.classList.add('hidden');

        mobileNavAnalysis?.classList.remove('hidden');
        mobileNavQna?.classList.remove('hidden');
        mobileMyPageBtn?.classList.remove('hidden');
        mobileLogoutBtn?.classList.remove('hidden');
        mobileLoginBtn?.classList.add('hidden');
      } else {
        navAnalysis?.classList.add('hidden');
        navQna?.classList.add('hidden');
        myPageBtn?.classList.add('hidden');
        logoutBtn?.classList.add('hidden');
        loginBtn?.classList.remove('hidden');

        mobileNavAnalysis?.classList.add('hidden');
        mobileNavQna?.classList.add('hidden');
        mobileMyPageBtn?.classList.add('hidden');
        mobileLogoutBtn?.classList.add('hidden');
        mobileLoginBtn?.classList.remove('hidden');
      }
    }

    function bindHeaderActions() {
      document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/';
      });

      document.getElementById('mobileLogoutBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        if (typeof closeMobileNav === 'function') closeMobileNav();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/';
      });
    }

    function configureWelcomeContent() {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      const promo = params.get('promo') || localStorage.getItem('signupPromo');

      const card = document.getElementById('welcomeCard');
      const icon = document.getElementById('welcomeIcon');
      const title = document.querySelector('.welcome-title');
      const desc = document.querySelector('.welcome-desc');
      const mainBtn = document.getElementById('mainActionBtn');

      if (role === 'tutor') {
        card.classList.add('is-tutor');
        icon.classList.remove('fa-check-circle');
        icon.classList.add('fa-clock');
        title.innerHTML = '파트너 지원이<br>완료되었습니다!';
        desc.innerHTML = '스터디크랙 파트너로 지원해주셔서 감사합니다.<br>현재 <strong>관리자 승인 대기 중</strong>이며,<br>가입 심사 및 승인 완료 후 즉시 안내해 드리겠습니다.';
        mainBtn.href = '/';
        mainBtn.textContent = '메인으로 이동하기';
      }

      if (promo && promo.includes('-STC')) {
        const mbti = decodePromoMbti(promo);
        if (mbti) {
          mainBtn.insertAdjacentHTML('afterend',
            '<a href="/analysis" class="btn btn--primary welcome-btn welcome-btn--analysis"><i class="fas fa-file-pdf" aria-hidden="true"></i> [' + mbti + '] 보고서 받으러 가기</a>'
          );
        }
      }
    }

    function decodePromoMbti(promo) {
      try {
        const hex = promo.replace('-STC', '').replace('-', '');
        let mbti = '';
        for (let i = 0; i < hex.length; i += 2) {
          mbti += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        }
        return escapeHtml(mbti.toUpperCase());
      } catch (error) {
        return '';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
