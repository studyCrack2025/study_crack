<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if('scrollRestoration'in history)history.scrollRestoration='manual';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
    <title>로그인 처리 중 - 스터디크랙</title>

    <link rel="stylesheet" href="/css/style.css?v=20260524a">
    <link rel="stylesheet" href="/css/auth.css?v=20260524a">
    <link rel="stylesheet" href="/css/social-callback.css?v=20260729a">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

</head>
<body class="auth-body social-callback-page">
    <div class="auth-card social-callback-status">
        <img src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack 로고" class="auth-logo-img">
        <p id="statusMsg">소셜 로그인을 처리하고 있습니다.<br>잠시만 기다려 주세요...</p>
    </div>

    <div id="socialSignupTermsModal" class="modal hidden">
        <div class="modal-content auth-modal social-terms-modal">
            <span class="close-btn" onclick="closePendingSocialSignupTermsModal()">&times;</span>
            <h3>소셜 회원가입 약관 동의</h3>
            <p class="modal-desc">가입되지 않은 소셜 계정입니다. 회원가입을 완료하려면 필수 약관 동의가 필요합니다.</p>

            <div class="social-terms-list">
                <label class="terms-all social-terms-all">
                    <input type="checkbox" id="socialSignupAllConsent">
                    <strong>약관 전체 동의</strong>
                </label>
                <hr class="terms-divider social-terms-divider">
                <div class="terms-item">
                    <label><input type="checkbox" class="social-required-term"> (필수) 표준이용약관 동의</label>
                    <a href="#" data-social-term-detail="standard">전문보기</a>
                </div>
                <div class="terms-item">
                    <label><input type="checkbox" class="social-required-term"> (필수) 서비스 이용약관 조항 동의</label>
                    <a href="#" data-social-term-detail="service">전문보기</a>
                </div>
                <div class="terms-item">
                    <label><input type="checkbox" class="social-required-term"> (필수) 개인정보 처리방침 동의</label>
                    <a href="#" data-social-term-detail="privacy">전문보기</a>
                </div>
                <div class="terms-item">
                    <label><input type="checkbox" class="social-required-term"> (필수) 환불 규정 동의</label>
                    <a href="#" data-social-term-detail="refund">전문보기</a>
                </div>
                <div class="terms-item">
                    <label><input type="checkbox" id="socialSignupMarketingConsent"> (선택) 마케팅 정보 수신 동의</label>
                    <a href="#" data-social-term-detail="marketing">전문보기</a>
                </div>
            </div>
            <p class="social-terms-note">마케팅 정보 수신 동의는 선택 사항이며, 동의하지 않아도 회원가입과 서비스 이용이 가능합니다.</p>

            <button type="button" class="auth-btn" onclick="confirmPendingSocialSignupTerms()">동의하고 회원가입 완료</button>
        </div>
    </div>

    <div id="socialTermDetailModal" class="modal hidden">
        <div class="modal-content term-modal-content">
            <span class="close-btn" onclick="closeSocialTermDetailModal()">&times;</span>
            <h3 id="socialTermDetailTitle"></h3>
            <div id="socialTermDetailText" class="term-text-box"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="/js/config.js?v=20260524a"></script>
    <script src="/js/shared/api.js?v=20260602f"></script>
    <script src="/js/auth.js?v=20260602f"></script>
    <script src="/js/social-callback.js?v=20260602e"></script>
</body>
</html>
