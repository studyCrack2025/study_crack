<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="facebook-domain-verification" content="55eup0qlw7p4hdgj5hyv2fsmhksvoj" />

    <title>안전한 결제 - 스터디크랙</title>

    <link rel="stylesheet" href="/css/style.css?v=20260524a">
    <link rel="stylesheet" href="/css/checkout.css?v=20260524a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="checkout-body">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="checkout-wrapper">

        <!-- 좌측: 주문자 정보 (read-only) -->
        <div class="order-summary-panel">
            <button class="btn-back" onclick="history.back()"><i class="fas fa-arrow-left"></i> 뒤로가기</button>

            <div class="summary-content">
                <span class="brand-logo">StudyCrack</span>
                <h2 class="summary-title">주문자 정보</h2>

                <div class="buyer-info-section">
                    <div class="buyer-info-field">
                        <span class="buyer-info-label">이름</span>
                        <span id="buyerName" class="buyer-info-value">-</span>
                    </div>
                    <div class="buyer-info-field">
                        <span class="buyer-info-label">전화번호</span>
                        <span id="buyerPhone" class="buyer-info-value">-</span>
                    </div>
                    <div class="buyer-info-field">
                        <span class="buyer-info-label">이메일 주소</span>
                        <span id="buyerEmail" class="buyer-info-value">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측: 주문 내역 + 결제 수단 선택 -->
        <div class="payment-form-panel">
            <div class="form-header">
                <h3>주문 내역</h3>
                <span class="secure-badge"><i class="fas fa-lock"></i> NICEPAY 안전 결제</span>
            </div>

            <div class="product-info-box">
                <div id="chkProductName" class="chk-p-name">멤버십 불러오는 중...</div>
                <div id="chkProductDesc" class="chk-p-desc">...</div>
            </div>

            <div class="price-line">
                <span>결제 금액</span>
                <span id="chkPrice" class="chk-price">0원</span>
            </div>

            <div class="billing-notice" id="billingNotice"></div>

            <div class="section-divider"></div>

            <h4 class="section-label">결제 수단 선택</h4>
            <div class="payment-method-group">
                <label class="payment-method-card" for="methodCard">
                    <input type="radio" id="methodCard" name="payMethod" value="card">
                    <div class="pm-card-inner">
                        <i class="fas fa-credit-card pm-icon"></i>
                        <span class="pm-label">신용카드</span>
                    </div>
                </label>
                <label class="payment-method-card" for="methodBank">
                    <input type="radio" id="methodBank" name="payMethod" value="bank">
                    <div class="pm-card-inner">
                        <i class="fas fa-university pm-icon"></i>
                        <span class="pm-label">실시간<br>계좌이체</span>
                    </div>
                </label>
                <label class="payment-method-card" for="methodVbank">
                    <input type="radio" id="methodVbank" name="payMethod" value="vbank">
                    <div class="pm-card-inner">
                        <i class="fas fa-file-invoice pm-icon"></i>
                        <span class="pm-label">가상계좌</span>
                    </div>
                </label>
            </div>

            <div class="terms-agree">
                <label>
                    <input type="checkbox" id="agreeTerms">
                    <span>본 상품은 1회성 단건 결제이며, 결제 후 4주 동안 이용 가능함에 동의합니다.</span>
                </label>
            </div>

            <button type="button" class="btn-checkout" id="btnFinalPay" onclick="submitCheckout()">
                <span id="btnPayAmount">0원</span> 결제하기
            </button>
        </div>
    </div>

    <script src="/js/config.js?v=20260524a"></script>
    <script src="https://pay.nicepay.co.kr/v1/js/"></script>
    <script src="/js/checkout.js?v=20260524a"></script>
</body>
</html>
