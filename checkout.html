<!DOCTYPE html>
<html lang="ko">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KNHVMTR5');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전한 결제 - 스터디크랙</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="checkout-body">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="checkout-wrapper">
        <div class="order-summary-panel">
            <button class="btn-back" onclick="history.back()"><i class="fas fa-arrow-left"></i> 뒤로가기</button>
            
            <div class="summary-content">
                <span class="brand-logo">StudyCrack</span>
                <h2 class="summary-title">주문 요약</h2>
                
                <div class="product-info-box">
                    <div id="chkProductName" class="chk-p-name">멤버십 불러오는 중...</div>
                    <div id="chkProductDesc" class="chk-p-desc">...</div>
                </div>

                <div class="price-line">
                    <span>결제 금액</span>
                    <span id="chkPrice" class="chk-price">0원</span>
                </div>
                
                <div class="billing-notice">
                    <i class="fas fa-info-circle"></i> 다음 결제일은 1개월 뒤인 <strong id="chkNextDate">00월 00일</strong>입니다. 언제든 해지 가능합니다.
                </div>
            </div>
        </div>

        <div class="payment-form-panel">
            <div class="form-header">
                <h3>결제 수단</h3>
                <span class="secure-badge"><i class="fas fa-lock"></i> NICEPAY 안전 결제</span>
            </div>

            <form id="checkoutForm">
                <div class="form-group">
                    <label for="cardNumber">카드 번호</label>
                    <div class="input-with-icon">
                        <i class="far fa-credit-card"></i>
                        <input type="text" id="cardNumber" placeholder="0000 - 0000 - 0000 - 0000" inputmode="numeric" maxlength="25">
                    </div>
                </div>
                
                <div class="form-row-multi">
                    <div class="form-group">
                        <label for="cardExpiry">유효기간</label>
                        <input type="text" id="cardExpiry" placeholder="MM / YY" inputmode="numeric" maxlength="7">
                    </div>
                    <div class="form-group">
                        <label for="cardPwd">비밀번호</label>
                        <div class="pwd-input-wrap">
                            <input type="password" id="cardPwd" placeholder="앞 2자리" inputmode="numeric" maxlength="2">
                            <span class="pwd-mask">**</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cardAuthDob">생년월일 (6자리)</label>
                    <input type="text" id="cardAuthDob" placeholder="예: 050101" inputmode="numeric" maxlength="10">
                </div>

                <div class="terms-agree">
                    <label>
                        <input type="checkbox" id="agreeTerms"> 
                        <span>정기결제 이용약관 및 개인정보 제공에 동의합니다.</span>
                    </label>
                </div>

                <button type="button" class="btn-checkout" id="btnFinalPay" onclick="submitCheckout()">
                    <span id="btnPayAmount">0원</span> 결제하기
                </button>
            </form>
        </div>
    </div>

    <script src="/js/checkout.js"></script>
</body>
</html>
