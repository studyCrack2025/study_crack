<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 시스템 - 스터디크랙</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="/js/config.js"></script>

    <style>
        /* 관리자 페이지 전용 추가 스타일 (기존 auth.css 유지) */
        .admin-badge {
            display: inline-block;
            background: #1e293b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .mfa-icon {
            font-size: 2.5rem;
            color: #2563EB;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="/" class="auth-logo-link">
            <img src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack 로고" class="auth-logo-img">
        </a>
        
        <div class="admin-badge">ADMIN SYSTEM</div>
        <h2 id="formTitle">관리자 로그인</h2>
        
        <div id="loginStep" class="auth-form">
            <div class="form-group">
                <input type="email" id="adminEmail" placeholder="관리자 이메일" required>
            </div>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="비밀번호" required>
            </div>
            <button class="auth-btn" onclick="handleAdminSignIn()" style="background-color: #1e293b;">보안 로그인</button>
        </div>

        <div id="mfaStep" class="auth-form hidden">
            <div class="mfa-icon">🔒</div>
            <p style="font-size: 0.9rem; color: #475569; margin-bottom: 20px;">
                등록된 기기의 authenticator의<br><strong>6자리 인증 코드</strong>를 입력해주세요.
            </p>
            <div class="form-group">
                <input type="text" id="mfaCode" placeholder="인증 코드 6자리" maxlength="6" style="text-align: center; font-size: 1.2rem; letter-spacing: 5px; font-weight: bold;" required>
            </div>
            <button class="auth-btn" onclick="handleMFASubmit()" style="background-color: #2563EB;">인증 완료 및 접속</button>
            <button class="auth-btn" onclick="cancelMFA()" style="background-color: #94a3b8; margin-top: 10px;">취소</button>
        </div>
    </div>

    <script>
        const poolData = {
            UserPoolId: CONFIG.cognito.userPoolId,
            ClientId: CONFIG.cognito.clientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        
        let globalCognitoUser = null; // MFA 단계를 위해 유저 객체 임시 저장

        // 엔터키 이벤트 리스너 (이메일, 비밀번호 모두 적용)
        const triggerAdminSignIn = (e) => {
            if (e.key === 'Enter') handleAdminSignIn();
        };
        document.getElementById('adminEmail').addEventListener('keypress', triggerAdminSignIn);
        document.getElementById('adminPassword').addEventListener('keypress', triggerAdminSignIn);

        // MFA 코드 엔터키 이벤트
        document.getElementById('mfaCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleMFASubmit();
        });

        // Step 1: 아이디/비밀번호 검증
        function handleAdminSignIn() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!email || !password) {
                alert("이메일과 비밀번호를 모두 입력해주세요.");
                return;
            }

            const authData = { Username: email, Password: password };
            const authDetails = new AmazonCognitoIdentity.AuthenticationDetails(authData);
            const userData = { Username: email, Pool: userPool };
            globalCognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

            globalCognitoUser.authenticateUser(authDetails, {
                onSuccess: function(result) {
                    processAdminSuccess(result);
                },
                onFailure: function(err) {
                    alert("인증 실패: " + (err.message || "이메일 또는 비밀번호가 틀렸습니다."));
                },
                // SMS MFA가 걸려있을 때 호출됨
                mfaRequired: function(codeDeliveryDetails) {
                    showMFAInput();
                },
                totpRequired: function(secretCode) {
                    showMFAInput();
                }
            });
        }

        // MFA 입력창을 띄우는 중복 코드를 함수로 분리
        function showMFAInput() {
            document.getElementById('formTitle').innerText = "2단계 인증 (MFA)";
            document.getElementById('loginStep').classList.add('hidden');
            document.getElementById('mfaStep').classList.remove('hidden');
            document.getElementById('mfaCode').focus();
        }

        // Step 2: MFA 코드 검증
        function handleMFASubmit() {
            const mfaCode = document.getElementById('mfaCode').value.trim();
            if (!mfaCode || mfaCode.length !== 6) {
                alert("6자리 인증 코드를 정확히 입력해주세요.");
                return;
            }
            
            globalCognitoUser.sendMFACode(mfaCode, {
                onSuccess: function(result) {
                    processAdminSuccess(result);
                },
                onFailure: function(err) {
                    alert("인증 코드가 틀렸거나 만료되었습니다.\n(" + err.message + ")");
                }
            }, 'SOFTWARE_TOKEN_MFA');
        }

        function cancelMFA() {
            globalCognitoUser = null;
            document.getElementById('formTitle').innerText = "관리자 로그인";
            document.getElementById('loginStep').classList.remove('hidden');
            document.getElementById('mfaStep').classList.add('hidden');
            document.getElementById('mfaCode').value = '';
            document.getElementById('adminPassword').value = '';
        }

        // 공통: 토큰 저장 및 백엔드 권한 검증
        function processAdminSuccess(authResult) {
            const accessToken = authResult.getAccessToken().getJwtToken();
            const idToken = authResult.getIdToken().getJwtToken();
            const payload = authResult.getIdToken().payload;
            const groups = payload['cognito:groups'] || [];
            
            // 1. 로컬스토리지 세팅
            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('idToken', idToken);

            // 2. 토큰 꼬리표에 'Admins'가 있는지 0.001초 만에 즉시 확인!
            if (groups.includes('Admins')) {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userId', payload.sub);
                alert("관리자 인증이 완료되었습니다.");
                window.location.href = '/admin'; // 관리자 대시보드로 이동
            } else {
                // 일반 유저나 튜터가 로그인한 경우 즉시 차단
                alert("접근 거부: 관리자 권한이 없습니다.");
                if (globalCognitoUser) globalCognitoUser.signOut();
                localStorage.clear();
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
