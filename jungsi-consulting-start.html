<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.hash.slice(1));
                var applicationId = params.get('app') || '';
                var token = params.get('invite') || '';
                if (/^APP_[0-9a-f-]{36}$/i.test(applicationId) && /^[A-Za-z0-9_-]{43}$/.test(token)) {
                    var previous = JSON.parse(sessionStorage.getItem('sc_jungsi_invite_v1') || 'null');
                    sessionStorage.setItem('sc_jungsi_invite_v1', JSON.stringify({
                        version: 1,
                        applicationId: applicationId,
                        token: token,
                        idempotencyKey: previous && previous.applicationId === applicationId && previous.idempotencyKey
                            ? previous.idempotencyKey
                            : 'claim_' + crypto.randomUUID(),
                        capturedAt: Date.now()
                    }));
                }
            } catch (_) {}
            history.replaceState(null, '', window.location.pathname + window.location.search);
        })();
    </script>
    <title>StudyCrack 정시 컨설팅 시작</title>
    <link rel="stylesheet" href="/css/jungsi-consulting-start.css">
</head>
<body>
    <main class="jungsi-start-shell">
        <section class="jungsi-start-card" aria-labelledby="startTitle">
            <img class="jungsi-start-logo" src="/assets/images/studycrack_logo_wo_bg.png" alt="StudyCrack">
            <p class="jungsi-start-kicker">2027 정시 컨설팅</p>
            <h1 id="startTitle">컨설팅 이용 인증</h1>
            <p id="startStatus" class="jungsi-start-status" role="status">초대 정보를 확인하고 있습니다.</p>

            <div id="inviteSummary" class="jungsi-start-summary" hidden>
                <p><span>등록 이메일</span><strong id="maskedEmail"></strong></p>
                <p><span>등록 전화번호</span><strong id="maskedPhone"></strong></p>
                <p><span>인증 기한</span><strong id="expiresAt"></strong></p>
            </div>

            <div id="authActions" class="jungsi-start-actions" hidden>
                <a id="loginAction" class="jungsi-start-primary" href="/login?returnUrl=%2F2027-jungsi-consulting%2Fstart">로그인</a>
                <a id="signupAction" class="jungsi-start-secondary" href="/signup?returnUrl=%2F2027-jungsi-consulting%2Fstart">회원가입</a>
            </div>

            <form id="claimForm" class="jungsi-start-form" hidden>
                <label for="inviteCode">이메일로 받은 10자리 인증코드</label>
                <input id="inviteCode" name="inviteCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{10}" maxlength="10" required>
                <button id="claimButton" type="submit">유료회원 인증하고 시작하기</button>
            </form>

            <button id="clearInvite" class="jungsi-start-link" type="button">이 초대 정보 지우기</button>
        </section>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/shared/api.js"></script>
    <script src="/js/jungsi-consulting-start.js"></script>
</body>
</html>
