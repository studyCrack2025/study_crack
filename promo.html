    <title>StudyCrack - 학습 성향 진단 결과</title>
    
    <style>
        :root { color-scheme: light; }
        
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
            /* 초기 배경색 (이미지 로드 전) */
            background-color: #f8f9fa;
            /* 배경 이미지 설정 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* 배경 고정 */
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 상단 네비게이션 (StudyCrack 로고) */
        header {
            text-align: center;
            padding: 15px 0;
            /* 헤더도 약간 투명하게 */
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }

        /* 메인 컨텐츠 영역 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            /* 반투명 배경 및 블러 효과 적용 */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* Safari 지원 */
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            /* 더 부드럽고 깊이감 있는 그림자 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            text-align: center;
            padding: 50px 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5); /* 테두리 살짝 */
        }
        
        /* 모바일에서 패딩 조정 */
        @media (max-width: 480px) {
            .card {
                padding: 40px 25px;
            }
        }

        /* 결과가 없을 때(파라미터 오류 등) */
        .hidden {
            display: none;
        }

        /* MBTI 코드 배지 */
        .mbti-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4a90e2, #145388); /* 그라데이션 적용 */
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        /* 키워드 태그들 */
        .keywords {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
            font-weight: 600;
            word-break: keep-all;
            line-height: 1.5;
        }

        /* 메인 타이틀 (유형 설명) */
        .result-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a252f;
            margin-bottom: 35px;
            word-break: keep-all;
            line-height: 1.4;
        }

        /* 솔루션 박스 (전략) */
        .solution-box {
            background-color: rgba(241, 243, 245, 0.8); /* 반투명 적용 */
            padding: 25px;
            border-radius: 16px;
            text-align: left;
            margin-bottom: 35px;
            border-left: 6px solid #4a90e2; /* 강조색 변경 */
        }

        .solution-label {
            font-size: 0.85rem;
            color: #4a90e2;
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .solution-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #2c3e50;
            word-break: keep-all;
            line-height: 1.6;
        }

        /* CTA 버튼 */
        .cta-button {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(44, 62, 80, 0.4);
            background: linear-gradient(135deg, #34495e, #2c3e50);
        }

        .cta-button:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
        }

        /* 로딩/에러 메시지 */
        #error-message {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            color: #e74c3c;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNHVMTR5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <header>
        <div class="logo">StudyCrack</div>
    </header>

    <main>
        <div id="result-card" class="card hidden">
            <span id="mbti-code" class="mbti-badge">TYPE</span>
            <div id="mbti-keywords" class="keywords">키워드 영역</div>
            
            <h1 id="mbti-desc" class="result-title">
                유형 설명이 여기에 들어갑니다.
            </h1>

            <div class="solution-box">
                <span class="solution-label">맞춤 학습 전략</span>
                <p id="mbti-strategy" class="solution-text">
                    전략 내용이 여기에 들어갑니다.
                </p>
            </div>

            <button id="cta-btn" class="cta-button">보고서 받으러 가기</button>
        </div>

        <div id="error-message" class="hidden">
            <p>잘못된 접근입니다.<br>진단 결과를 찾을 수 없습니다.</p>
        </div>
    </main>

    <script>
        // 0. 랜덤 배경 설정 함수
        function setRandomBackground() {
            // 1부터 4까지의 랜덤 정수 생성
            const bgNumber = Math.floor(Math.random() * 4) + 1;
            // body의 배경 이미지 설정 (경로 확인 필요)
            document.body.style.backgroundImage = `url('assets/backgrounds/bg_promo${bgNumber}.png')`;
        }

        // 1. MBTI 데이터 정의 (기존과 동일)
        const mbtiData = {
            "CSDR": {
                keywords: "개념 중심 | 안정 반복 | 데이터·근거 | 루틴 고정",
                desc: "개념을 탄탄히 쌓고 반복으로 굳히며 근거로 확신을 만드는 루틴 고정형",
                strategy: "개념노트 1권 고정 + 기출 반복회독 + 오답은 근거 한 줄로만 정리해서 루틴 유지"
            },
            "CSDF": {
                keywords: "개념 중심 | 안정 반복 | 데이터·근거 | 유연 전환",
                desc: "개념과 반복을 기반으로 하되 필요하면 방식을 바꿔 성과를 뽑는 조정형",
                strategy: "기출 2회독까지는 고정 루틴 + 이후 약점 단원만 새로운 방식(실모/변형)로 갈아타기"
            },
            "CSER": {
                keywords: "개념 중심 | 안정 반복 | 직관·흐름 | 루틴 고정",
                desc: "개념 이해는 깊게 가지만 풀이가 흐름·감으로 굳어질 때가 있는 고정형",
                strategy: "개념 흐름도 만들고 문제는 매번 풀이 근거를 문장으로 강제해서 감을 근거로 바꾸기"
            },
            "CSEF": {
                keywords: "개념 중심 | 안정 반복 | 직관·흐름 | 유연 전환",
                desc: "개념 중심으로 큰 그림을 잡고 상황 따라 유연하게 접근하는 스타일",
                strategy: "단원별 핵심 개념 10줄 요약 + 다양한 유형을 맛보기로 돌리며 내 방식으로 재구성"
            },
            "CMDR": {
                keywords: "개념 중심 | 변형 대응 | 데이터·근거 | 루틴 고정",
                desc: "개념 기반이지만 변형을 즐기고 근거를 세워 흔들리지 않게 만드는 승부형",
                strategy: "기출로 틀을 만든 뒤 변형/실모로 확장 + 오답은 왜 그 근거가 무너졌는지 원인분해"
            },
            "CMDF": {
                keywords: "개념 중심 | 변형 대응 | 데이터·근거 | 유연 전환",
                desc: "개념을 토대로 변형에 강하고 데이터로 빠르게 수정해 성장하는 최적화형",
                strategy: "실모/변형을 주력으로 두고 정답률 기록 + 약점 단원만 개념 복구 후 다시 변형 투입"
            },
            "CMER": {
                keywords: "개념 중심 | 변형 대응 | 직관·흐름 | 루틴 고정",
                desc: "개념은 잘 잡는데 변형 대응이 감각 위주로 흘러 루틴이 경직될 수 있는 타입",
                strategy: "변형 문제는 풀이 템플릿(조건-근거-결론) 고정 + 매주 오답유형 3개만 루틴에 편입"
            },
            "CMEF": {
                keywords: "개념 중심 | 변형 대응 | 직관·흐름 | 유연 전환",
                desc: "개념 큰 그림을 바탕으로 변형을 유연하게 받아치며 감각을 빠르게 키우는 타입",
                strategy: "변형 세트로 감각을 올리되 매 세트 후 핵심 개념 3개를 역으로 정리해 기반을 고정"
            },
            "ISDR": {
                keywords: "문제 중심 | 안정 반복 | 데이터·근거 | 루틴 고정",
                desc: "문제부터 들어가 반복으로 감을 쌓고 근거로 안정감을 만드는 실전 고정형",
                strategy: "기출 유형별 세트 반복 + 오답은 근거(조건/개념) 체크리스트로만 관리해서 실수 차단"
            },
            "ISDF": {
                keywords: "문제 중심 | 안정 반복 | 데이터·근거 | 유연 전환",
                desc: "문제 반복을 통해 감을 만들고 성과가 안 나오면 전략을 빠르게 바꾸는 조정형",
                strategy: "기출 반복으로 베이스 만든 뒤 점수 정체 구간에만 풀이법/시간배분/자료 해석법 교체"
            },
            "ISER": {
                keywords: "문제 중심 | 안정 반복 | 직관·흐름 | 루틴 고정",
                desc: "문제 풀이 흐름이 좋고 반복도 하는데 근거가 약하면 감으로 맞추는 구간이 생김",
                strategy: "매 문제에 근거 키워드 1개 강제 메모 + 비슷한 문제 5개 묶어서 근거가 같은지 비교"
            },
            "ISEF": {
                keywords: "문제 중심 | 안정 반복 | 직관·흐름 | 유연 전환",
                desc: "문제 중심으로 흐름을 타며 다양한 접근을 시도하는 유연 실전형",
                strategy: "기출로 기본 루트 만든 뒤 실모로 루트 다양화 + 오답은 정답근거를 내 말로 재서술"
            },
            "IMDR": {
                keywords: "문제 중심 | 변형 대응 | 데이터·근거 | 루틴 고정",
                desc: "문제 중심에 변형 대응도 강하고 근거로 확신을 세우는 하드캐리형",
                strategy: "변형/실모를 주력으로 돌리되 근거 기록(왜 이 선택이 최선인지)을 남겨 재현성 확보"
            },
            "IMDF": {
                keywords: "문제 중심 | 변형 대응 | 데이터·근거 | 유연 전환",
                desc: "변형 문제로 성장하고 데이터를 보고 방법을 갈아끼우는 고속 최적화형",
                strategy: "실모 점수/오답률 추적 + 약점 패턴만 집중 보정(시간, 자료, 함정)하고 바로 다시 실전 투입"
            },
            "IMER": {
                keywords: "문제 중심 | 변형 대응 | 직관·흐름 | 루틴 고정",
                desc: "변형 대응은 좋은데 직관에 의존하면 실수 변동폭이 커질 수 있는 타입",
                strategy: "변형은 계속 풀되 오답은 감으로 넘어가지 말고 틀린 이유를 조건/근거 단위로 쪼개기"
            },
            "IMEF": {
                keywords: "문제 중심 | 변형 대응 | 직관·흐름 | 유연 전환",
                desc: "변형을 즐기고 흐름으로 푸는 센스형이라 확 터지면 크게 오르는 타입",
                strategy: "변형 실모로 감각을 살리되 매일 10분은 근거 정리(정답근거 5개 암기)로 변동성 줄이기"
            }
        };

        // 2. URL 파라미터 파싱 및 렌더링
        document.addEventListener('DOMContentLoaded', () => {
            // 페이지 로드 시 랜덤 배경 설정 호출
            setRandomBackground();

            const urlParams = new URLSearchParams(window.location.search);
            const mbtiParam = urlParams.get('mbti'); // ?mbti=XXXX
            
            const resultCard = document.getElementById('result-card');
            const errorMessage = document.getElementById('error-message');

            if (mbtiParam) {
                const upperKey = mbtiParam.toUpperCase(); // 대소문자 무관하게 처리
                const data = mbtiData[upperKey];

                if (data) {
                    // 데이터 매핑
                    document.getElementById('mbti-code').textContent = upperKey;
                    document.getElementById('mbti-keywords').textContent = data.keywords;
                    document.getElementById('mbti-desc').textContent = data.desc;
                    document.getElementById('mbti-strategy').textContent = data.strategy;
                    
                    // 카드 표시
                    resultCard.classList.remove('hidden');
                } else {
                    // MBTI 키가 잘못된 경우
                    errorMessage.classList.remove('hidden');
                }
            } else {
                // 파라미터가 없는 경우
                errorMessage.classList.remove('hidden');
            }

            // 3. 버튼 클릭 이벤트 리스너
            document.getElementById('cta-btn').addEventListener('click', (e) => {
                e.preventDefault();
                alert('회원가입이 필요합니다');
                
                const urlParams = new URLSearchParams(window.location.search);
                const mbtiParam = urlParams.get('mbti') || ''; 
                
                if (mbtiParam) {
                    // 🔥 [암호화] 문자를 16진수 쿠폰 코드 형태로 변환 (예: ISDF -> 4953-4446-STC)
                    let hex = '';
                    for(let i=0; i<mbtiParam.length; i++) {
                        hex += mbtiParam.charCodeAt(i).toString(16).toUpperCase();
                    }
                    const secretPromoCode = `${hex.substring(0,4)}-${hex.substring(4,8)}-STC`;
                    
                    window.location.href = `/signup?promo=${secretPromoCode}`;
                } else {
                    window.location.href = '/signup';
                }
            });
        });
    </script>
</body>
</html>
