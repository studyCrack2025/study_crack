<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if('scrollRestoration'in history)history.scrollRestoration='manual';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="facebook-domain-verification" content="55eup0qlw7p4hdgj5hyv2fsmhksvoj" />
    <meta name="naver-site-verification" content="e70d8cbe6d67167b9f8f6267985c17c42b616684" />
    
    <title>무통장 입금 결제 - 스터디크랙</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/checkout.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* 계좌이체 전용 인라인 스타일 */
        .transfer-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
        }
        .bank-name { font-size: 1.1rem; color: #64748b; margin-bottom: 5px; }
        .account-number { font-size: 1.8rem; font-weight: 900; color: #1e293b; letter-spacing: 1px; margin-bottom: 5px; }
        .account-holder { font-size: 1rem; color: #3b82f6; font-weight: 600; }
        
        .warning-box {
            background: #fff1f2;
            border-left: 4px solid #e11d48;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #be123c;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .warning-box strong { font-size: 1.05rem; }

        /* 동적 뱃지 기본 스타일 보완 */
        .secure-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body class="checkout-body">
    <div class="checkout-wrapper">
        <div class="order-summary-panel">
            <button class="btn-back" onclick="history.back()"><i class="fas fa-arrow-left"></i> 뒤로가기</button>
            <div class="summary-content">
                <span class="brand-logo">StudyCrack</span>
                <h2 class="summary-title">주문 요약</h2>
                <div class="product-info-box">
                    <div id="chkProductName" class="chk-p-name">멤버십 불러오는 중...</div>
                    <div id="chkProductDesc" class="chk-p-desc">...</div>
                </div>
                <div class="price-line">
                    <span>결제 금액</span>
                    <span id="chkPrice" class="chk-price">0원</span>
                </div>
            </div>
        </div>

        <div class="payment-form-panel">
            <div class="form-header">
                <h3>무통장 입금 안내</h3>
                <span id="planBadge" class="secure-badge" style="background: #e2e8f0; color: #475569;">
                    <i class="fas fa-spinner fa-spin"></i> 로딩중
                </span>
            </div>

            <div class="transfer-box">
                <div class="bank-name">토스뱅크</div>
                <div class="account-number">1002-4680-1752</div>
                <div class="account-holder">예금주 : 스터디크랙</div>
            </div>

            <div class="warning-box">
                <i class="fas fa-exclamation-triangle"></i> 주의사항<br>
                반드시 회원가입 시 입력하신 <strong><span id="depositName">본인 이름</span></strong>으로 입금해 주세요. 입금자명이 다를 경우 승인이 지연될 수 있습니다.
            </div>

            <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
                위 계좌로 송금을 완료하신 후, 아래 버튼을 눌러주세요.
            </p>

            <button type="button" class="btn-checkout" id="btnTransferComplete" onclick="submitTransfer()">
                송금 완료했습니다
            </button>
        </div>
    </div>
    
    <script src="/js/config.js"></script>
    <script>
        // 1. 모든 티어에 대한 가격, 설명, 디자인(색상) 데이터 통합 세팅
        const TIER_DATA = {
            // 100원 테스트 결제용 디자인 데이터
            'test': { 
                name: '테스트 결제', price: 100, 
                desc: '결제 시스템 점검용 테스트',
                color: '#10b981', bg: '#d1fae5', icon: 'fa-vial'
            },
            'basic': { 
                name: 'BASIC', price: 25000, 
                desc: '나만의 입시 분석 솔루션 기본 제공',
                color: '#2563EB', bg: '#eff6ff', icon: 'fa-check-circle'
            },
            'standard': { 
                name: 'STANDARD', price: 149000, 
                desc: '기초조사서 작성 및 무제한 합격 예측',
                color: '#475569', bg: '#f1f5f9', icon: 'fa-chart-bar'
            },
            'pro': { 
                name: 'PRO', price: 299000, 
                desc: '전담 컨설턴트 1:1 밀착 배정 및 완벽 전략',
                color: '#D97706', bg: '#fffbeb', icon: 'fa-crown'
            },
            'trial': { 
                name: '체험단', price: 30000, 
                desc: '낮은 비용으로 PRO의 모든 기능을 1개월 체험',
                color: '#7C3AED', bg: '#f5f3ff', icon: 'fa-gem'
            }
        };

        const USER_API_URL = CONFIG.api.user;
        let currentTier = 'basic'; // 전역 변수로 저장해 리다이렉트 시 활용

        document.addEventListener('DOMContentLoaded', () => {
            const dataStr = localStorage.getItem('checkoutData');
            if (!dataStr) {
                alert("결제 정보가 없습니다.");
                window.location.href = '/payment';
                return;
            }

            const checkoutData = JSON.parse(dataStr);
            currentTier = checkoutData.tier || 'basic';
            
            // 만약 TIER_DATA에 없는 값이 들어오면 basic으로 기본 처리
            const tierInfo = TIER_DATA[currentTier] || TIER_DATA['basic'];

            // 좌측 요약 정보 업데이트
            document.getElementById('chkProductName').innerText = checkoutData.productName;
            document.getElementById('chkProductDesc').innerText = tierInfo.desc;
            document.getElementById('chkPrice').innerText = tierInfo.price.toLocaleString() + '원';
            document.getElementById('depositName').innerText = checkoutData.name;

            // 우측 상단 동적 뱃지 업데이트 (플랜에 맞는 색상과 텍스트 적용)
            const badge = document.getElementById('planBadge');
            badge.style.color = tierInfo.color;
            badge.style.background = tierInfo.bg;
            badge.innerHTML = `<i class="fas ${tierInfo.icon}"></i> ${tierInfo.name} 결제`;
        });

        // 이체 완료 요청 함수
        async function submitTransfer() {
            const btn = document.getElementById('btnTransferComplete');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 입금 확인 요청 중...`;
            btn.disabled = true;

            // TODO Stage5: auth.js 로드 후 getIdToken() 사용 필요
            const token = localStorage.getItem('idToken') || localStorage.getItem('accessToken');

            try {
                const response = await fetch(USER_API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ 
                        type: 'submit_trial_transfer',
                        data: { tier: currentTier }
                    })
                });

                if (response.ok) {
                    localStorage.removeItem('checkoutData'); // 결제 정보 초기화
                    window.location.href = `/success?tier=${currentTier}`;
                } else {
                    const errData = await response.json();
                    console.error("서버 에러:", errData);
                    alert("요청 처리 중 문제가 발생했습니다. 1:1 문의를 남겨주세요.");
                    btn.innerHTML = `송금 완료했습니다`;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("통신 에러:", error);
                alert("통신 오류가 발생했습니다. 네트워크 상태를 확인해주세요.");
                btn.innerHTML = `송금 완료했습니다`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
