name: Verify and Deploy

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: Successful push run ID to restore (same dev/main branch)
        type: string
        required: true
      rollback_commit:
        description: Full source commit from that run's release summary
        type: string
        required: true
      rollback_digest:
        description: Manifest SHA-256 from that run's release summary
        type: string
        required: true
      confirmation:
        description: Type rollback-dev or rollback-main to match the selected branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-name: ${{ steps.release-info.outputs.artifact-name }}
      manifest-digest: ${{ steps.release-info.outputs.manifest-digest }}
      source-commit: ${{ github.sha }}
    env:
      RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    defaults:
      run:
        working-directory: studycrack-mobile-app
    steps:
      - name: Checkout code and deployment history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studycrack-mobile-app/package-lock.json
      - name: Select required browser coverage
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../tools/verification-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check source contracts
        run: npm run check
      - name: Check deployment and verification boundaries
        run: node --test ../tools/test/*.test.mjs
      - name: Check web SEO contracts
        run: node ../tools/check_seo_contract.mjs
      - name: Check Basic v2 frontend contracts
        run: node ../tools/check_basic_v2_contract.mjs
      - name: Build mobile app bundle
        run: npm run build
      - name: Build versioned public artifact
        run: node ../tools/site-release.mjs build ../release-artifact "$GITHUB_SHA" "${RELEASE_BRANCH}-${GITHUB_SHA::8}"
      - name: Seal candidate bytes before browser tests
        id: candidate
        run: |
          ARTIFACT_DIGEST="$(node ../tools/site-release.mjs verify ../release-artifact "$GITHUB_SHA")"
          echo "manifest-digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Test required browser coverage
        id: browser
        env:
          STUDYCRACK_PREVIEW_ROOT: ${{ github.workspace }}/release-artifact/site
          PLAYWRIGHT_SUITE: ${{ steps.scope.outputs.suite }}
        run: npm run test:e2e -- --workers=2 --retries=0
      - name: Record browser timing and failures
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        run: |
          if test -f test-results/results.json; then
            node scripts/summarize-e2e-results.mjs test-results/results.json
          else
            echo 'Browser verification ended before producing a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Seal verified artifact identity
        id: release-info
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.manifest-digest }}
        run: |
          ARTIFACT_DIGEST="$(node ../tools/site-release.mjs verify ../release-artifact "$GITHUB_SHA" "$CANDIDATE_DIGEST")"
          echo "manifest-digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact-name=public-site-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          {
            echo '### Verified artifact (rollback eligible only after a successful push deployment)'
            echo "Source run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Manifest SHA-256: ${ARTIFACT_DIGEST}"
            echo 'Retention: 14 days; restore only to the same branch.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified public artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-info.outputs.artifact-name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            studycrack-mobile-app/playwright-report/
            studycrack-mobile-app/test-results/
          if-no-files-found: warn
          retention-days: 14

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-name: rollback-site-${{ github.run_id }}-${{ github.run_attempt }}
      manifest-digest: ${{ steps.source.outputs.manifestDigest }}
      source-commit: ${{ steps.source.outputs.sourceCommit }}
    steps:
      - name: Checkout current trusted deployment tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check deployment and rollback boundaries
        run: node --test tools/test/*.test.mjs
      - name: Validate explicit rollback source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          ROLLBACK_COMMIT: ${{ inputs.rollback_commit }}
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
        run: node tools/rollback-source.mjs
      - name: Download eligible immutable artifact by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifactId }}
          run-id: ${{ steps.source.outputs.sourceRunId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact/
      - name: Verify retained artifact with current public policy
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.sourceCommit }}
          VERIFIED_DIGEST: ${{ steps.source.outputs.manifestDigest }}
        run: node tools/site-release.mjs verify release-artifact "$RELEASE_COMMIT" "$VERIFIED_DIGEST"
      - name: Hand off unchanged rollback bytes
        uses: actions/upload-artifact@v4
        with:
          name: rollback-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [verify, rollback]
    if: >-
      ${{ always() && !cancelled() &&
          ((github.event_name == 'push' && needs.verify.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.rollback.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_COMMIT: ${{ needs.verify.outputs.source-commit || needs.rollback.outputs.source-commit }}
      VERIFIED_DIGEST: ${{ needs.verify.outputs.manifest-digest || needs.rollback.outputs.manifest-digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout deployment tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download verified public artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name || needs.rollback.outputs.artifact-name }}
          path: release-artifact/
      - name: Verify downloaded bytes before obtaining deployment credentials
        run: node tools/site-release.mjs verify release-artifact "$RELEASE_COMMIT" "$VERIFIED_DIGEST"

      # 1. DEV 환경 변수 설정 (dev 브랜치 푸시 시 실행)
      - name: Set Environment Variables for DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-DevRole" >> $GITHUB_ENV
          echo "S3_BUCKET=dev.studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=E3LXVB0NYLKN6X" >> $GITHUB_ENV

      # 2. PROD 환경 변수 설정 (main 브랜치 푸시 시 실행)
      - name: Set Environment Variables for PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-ProdRole" >> $GITHUB_ENV
          echo "S3_BUCKET=studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=EV58SGU5XCI3O" >> $GITHUB_ENV

      # 3. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Publish verified public files
        run: node tools/site-release.mjs publish release-artifact "$RELEASE_COMMIT" "$VERIFIED_DIGEST"

      - name: CloudFront Invalidation
        if: env.CF_DIST_ID != ''
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$CF_DIST_ID" --id "$INVALIDATION_ID"
      - name: Check published release identity, bytes and response contracts
        run: node tools/smoke-site-release.mjs "https://${S3_BUCKET}" release-artifact "$RELEASE_COMMIT" "$VERIFIED_DIGEST"
      - name: Report public security header readiness
        run: node tools/audit-security-headers.mjs "https://${S3_BUCKET}" --report-only
      - name: Record published release
        run: |
          {
            echo '### Published release smoke passed'
            echo "Source commit: ${RELEASE_COMMIT}"
            echo "Manifest SHA-256: ${VERIFIED_DIGEST}"
            echo "Release identity: https://${S3_BUCKET}/release.json"
            echo "Mobile smoke URL: https://${S3_BUCKET}/studycrack-mobile"
            echo 'Real-account authentication and physical-device acceptance remain separate gates.'
          } >> "$GITHUB_STEP_SUMMARY"
