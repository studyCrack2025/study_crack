name: Deploy to S3 and CloudFront (Secure OIDC)

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studycrack-mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studycrack-mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check source contracts
        run: npm run check
      - name: Check web SEO contracts
        run: node ../tools/check_seo_contract.mjs
      - name: Build mobile app bundle
        run: npm run build
      - name: Record architecture baseline
        run: node scripts/report-architecture-baseline.mjs > architecture-baseline.json
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: npm run test:e2e
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-verification-${{ github.sha }}
          path: |
            studycrack-mobile-app/architecture-baseline.json
            studycrack-mobile-app/playwright-report/
            studycrack-mobile-app/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 0. 배포 시점에 자산 버전을 자동 갱신 (dev/main 공통)
      - name: Bump asset query version for this deploy
        run: |
          ASSET_VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          echo "ASSET_VERSION=${ASSET_VERSION}" >> $GITHUB_ENV
          ./tools/bump_asset_version.sh "${ASSET_VERSION}"

      # 0.5 모바일 앱(Vite) 번들 빌드 — dist/ 산출물을 배포에 포함(소스 커밋만으론 번들이 없음)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build mobile app bundle
        run: |
          cd studycrack-mobile-app
          npm ci
          npm run build

      # 1. DEV 환경 변수 설정 (dev 브랜치 푸시 시 실행)
      - name: Set Environment Variables for DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-DevRole" >> $GITHUB_ENV
          echo "S3_BUCKET=dev.studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=E3LXVB0NYLKN6X" >> $GITHUB_ENV

      # 2. PROD 환경 변수 설정 (main 브랜치 푸시 시 실행)
      - name: Set Environment Variables for PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-ProdRole" >> $GITHUB_ENV
          echo "S3_BUCKET=studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=EV58SGU5XCI3O" >> $GITHUB_ENV

      # 3. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 4. S3 버킷으로 파일 동기화
      - name: Deploy to S3
        run: |
          # node_modules는 배포 제외(빌드 산출물 dist/만 포함)
          aws s3 sync . s3://${{ env.S3_BUCKET }} --delete \
            --exclude ".git/*" --exclude ".github/*" \
            --exclude "studycrack-mobile-app/node_modules/*"

          # HTML은 항상 재검증되도록 짧은 캐시
          aws s3 cp . s3://${{ env.S3_BUCKET }} --recursive \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 설치 메타데이터는 갱신 즉시 반영하고 아이콘은 버전 파일명으로 장기 캐시한다.
          aws s3 cp studycrack-mobile.webmanifest s3://${{ env.S3_BUCKET }}/studycrack-mobile.webmanifest \
            --content-type "application/manifest+json; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp assets/pwa s3://${{ env.S3_BUCKET }}/assets/pwa --recursive \
            --cache-control "public, max-age=31536000, immutable"

          # KCC 프로모션은 루트 HTML 파일을 사용자-facing clean URL로도 배포한다.
          aws s3 cp promotion_kcc01.html s3://${{ env.S3_BUCKET }}/promotion/kcc01 \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 버전 쿼리 붙는 정적 자산은 장기 캐시
          aws s3 cp . s3://${{ env.S3_BUCKET }} --recursive \
            --exclude "*" --include "js/*" --include "css/*" \
            --cache-control "public, max-age=31536000, immutable"

          # 모바일 entry는 고정 파일명이라 항상 재검증한다.
          aws s3 cp . s3://${{ env.S3_BUCKET }} --recursive \
            --exclude "*" \
            --include "studycrack-mobile-app/dist/studycrack-mobile.bundle.js" \
            --include "studycrack-mobile-app/dist/studycrack-mobile.css" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 분할 chunk는 content hash 파일명이므로 장기 캐시한다.
          aws s3 cp . s3://${{ env.S3_BUCKET }} --recursive \
            --exclude "*" \
            --include "studycrack-mobile-app/dist/chunks/*" \
            --include "studycrack-mobile-app/dist/assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      # 5. CloudFront 캐시 무효화 (CF_DIST_ID가 비어있지 않을 때만 실행)
      - name: CloudFront Invalidation
        if: env.CF_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CF_DIST_ID }} --paths "/*"
