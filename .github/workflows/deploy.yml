name: Deploy to S3 and CloudFront (Secure OIDC)

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.release-info.outputs.artifact-name }}
      manifest-digest: ${{ steps.release-info.outputs.manifest-digest }}
    defaults:
      run:
        working-directory: studycrack-mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studycrack-mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check source contracts
        run: npm run check
      - name: Check deployment boundaries
        run: node --test ../tools/test/site-release.test.mjs
      - name: Check web SEO contracts
        run: node ../tools/check_seo_contract.mjs
      - name: Build mobile app bundle
        run: npm run build
      - name: Build versioned public artifact
        run: node ../tools/site-release.mjs build ../release-artifact "$GITHUB_SHA" "${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
      - name: Record architecture baseline
        run: node scripts/report-architecture-baseline.mjs > architecture-baseline.json
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Test the public artifact
        env:
          STUDYCRACK_PREVIEW_ROOT: ${{ github.workspace }}/release-artifact/site
        run: npm run test:e2e
      - name: Seal verified artifact identity
        id: release-info
        run: |
          ARTIFACT_DIGEST="$(node ../tools/site-release.mjs verify ../release-artifact "$GITHUB_SHA")"
          echo "manifest-digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact-name=public-site-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload verified public artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-info.outputs.artifact-name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            studycrack-mobile-app/architecture-baseline.json
            studycrack-mobile-app/playwright-report/
            studycrack-mobile-app/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout deployment tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download verified public artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-artifact/
      - name: Verify downloaded bytes before obtaining deployment credentials
        env:
          VERIFIED_DIGEST: ${{ needs.verify.outputs.manifest-digest }}
        run: node tools/site-release.mjs verify release-artifact "$GITHUB_SHA" "$VERIFIED_DIGEST"

      # 1. DEV 환경 변수 설정 (dev 브랜치 푸시 시 실행)
      - name: Set Environment Variables for DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-DevRole" >> $GITHUB_ENV
          echo "S3_BUCKET=dev.studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=E3LXVB0NYLKN6X" >> $GITHUB_ENV

      # 2. PROD 환경 변수 설정 (main 브랜치 푸시 시 실행)
      - name: Set Environment Variables for PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::235270182853:role/StudyCrack-GitHubActions-ProdRole" >> $GITHUB_ENV
          echo "S3_BUCKET=studycrack.co.kr" >> $GITHUB_ENV
          echo "CF_DIST_ID=EV58SGU5XCI3O" >> $GITHUB_ENV

      # 3. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Publish verified public files
        env:
          VERIFIED_DIGEST: ${{ needs.verify.outputs.manifest-digest }}
        run: node tools/site-release.mjs publish release-artifact "$GITHUB_SHA" "$VERIFIED_DIGEST"

      - name: CloudFront Invalidation
        if: env.CF_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CF_DIST_ID }} --paths "/*"
